apiVersion: v1
kind: Service
metadata:
  name: open-webui-nas
  namespace: open-webui
spec:
  ports:
    - {name: https, port: 11436, targetPort: 11436, protocol: TCP}
---
apiVersion: v1
kind: Endpoints
metadata:
  name: open-webui-nas
  namespace: open-webui
subsets:
  - addresses:
      - ip: 10.0.10.5
    ports:
      - {name: https, port: 11436, protocol: TCP}
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: nas
  namespace: open-webui
spec:
  serverName: nas.owl.red
  insecureSkipVerify: false