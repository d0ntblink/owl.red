apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: open-webui
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteMany]
  storageClassName: nas-appdata-smb
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: open-webui
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: open-webui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: open-webui
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 100
        fsGroup: 100
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:v0.12.3-slim@sha256:5adfb0355bbe4a5860c0ba9482cc0b40f573de3749a21a64cf4789391a14fffc
          command: [uvicorn]
          args: ["open_webui.main:app", "--host", "0.0.0.0", "--port", "8080", "--proxy-headers", "--forwarded-allow-ips", "10.244.0.0/16"]
          ports:
            - {name: http, containerPort: 8080}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {cpu: "1", memory: 1536Mi}
          envFrom:
            - secretRef:
                name: open-webui-runtime
          env:
            - {name: DATA_DIR, value: /app/backend/data}
            - {name: STATIC_DIR, value: /tmp/static}
            - {name: HOME, value: /tmp}
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
            - {name: WEBUI_URL, value: "https://ai.owl.red"}
            - {name: CORS_ALLOW_ORIGIN, value: "https://ai.owl.red"}
            - {name: WEBUI_AUTH, value: "true"}
            - {name: WEBUI_ADMIN_EMAIL, value: admin@owl.red}
            - {name: WEBUI_ADMIN_NAME, value: Administrator}
            - {name: ENABLE_SIGNUP, value: "false"}
            - {name: ENABLE_API_KEYS, value: "true"}
            - {name: ENABLE_OAUTH, value: "false"}
            - {name: OLLAMA_BASE_URL, value: "https://nas.owl.red:11434"}
            - {name: ENABLE_OPENAI_API, value: "false"}
            - {name: DEFAULT_MODELS, value: "qwen2.5:3b"}
            - {name: DEFAULT_PINNED_MODELS, value: "qwen2.5:3b,qwen2.5:1.5b"}
            - {name: DEFAULT_MODEL_PARAMS, value: '{"num_ctx":4096,"num_predict":512,"temperature":0.1,"keep_alive":0}'}
            - {name: DATABASE_POOL_SIZE, value: "2"}
            - {name: DATABASE_POOL_MAX_OVERFLOW, value: "0"}
            - {name: OFFLINE_MODE, value: "true"}
            - {name: RAG_EMBEDDING_MODEL_AUTO_UPDATE, value: "false"}
            - {name: WHISPER_MODEL_AUTO_UPDATE, value: "false"}
            - {name: ENABLE_TITLE_GENERATION, value: "false"}
            - {name: ENABLE_TAGS_GENERATION, value: "false"}
            - {name: ENABLE_FOLLOW_UP_GENERATION, value: "false"}
            - {name: ENABLE_SEARCH_QUERY_GENERATION, value: "false"}
            - {name: ENABLE_RETRIEVAL_QUERY_GENERATION, value: "false"}
            - {name: ENABLE_IMAGE_PROMPT_GENERATION, value: "false"}
            - {name: ENABLE_CODE_EXECUTION, value: "false"}
            - {name: ENABLE_CODE_INTERPRETER, value: "false"}
            - {name: ENABLE_MEMORIES, value: "false"}
            - {name: ENABLE_AUTOMATIONS, value: "false"}
            - {name: ENABLE_CALENDAR, value: "false"}
            - {name: ENABLE_COMMUNITY_SHARING, value: "false"}
            - {name: USER_PERMISSIONS_CHAT_FILE_UPLOAD, value: "false"}
            - {name: USER_PERMISSIONS_CHAT_WEB_UPLOAD, value: "false"}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            failureThreshold: 36
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 30
          volumeMounts:
            - {name: data, mountPath: /app/backend/data}
            - {name: temporary, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
        - name: temporary
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: open-webui
spec:
  selector:
    app.kubernetes.io/name: open-webui
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: administration-access
  namespace: open-webui
spec:
  ipAllowList:
    sourceRange: [10.0.10.0/24, 10.0.20.10/32]
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: open-webui
  namespace: open-webui
spec:
  secretName: open-webui-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames: [ai.owl.red]
  privateKey:
    rotationPolicy: Always
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: open-webui
  namespace: open-webui
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`ai.owl.red`)
      kind: Rule
      middlewares:
        - name: administration-access
      services:
        - {name: open-webui-nas, port: 11436, scheme: https, serversTransport: nas}
  tls:
    secretName: open-webui-tls
  tls:
    secretName: open-webui-tls