apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: config
  namespace: home-assistant
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteMany]
  storageClassName: nas-appdata-smb
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-config
  namespace: home-assistant
data:
  configuration.yaml: |
    default_config:
    recorder:
      db_url: !env_var HOMEASSISTANT_DB_URL
      purge_keep_days: 10
      commit_interval: 30
    automation: !include automations.yaml
    script: !include scripts.yaml
    scene: !include scenes.yaml
  http.yaml: |
    use_x_forwarded_for: true
    trusted_proxies:
      - 10.244.0.0/16
  configure-http.py: |
    import asyncio
    from pathlib import Path

    import yaml

    from homeassistant.components.http import CONFIG_SCHEMA
    from homeassistant.components.http.config import (
        ActiveConfigType,
        async_get_and_load_store,
    )
    from homeassistant.core import HomeAssistant

    async def main():
        settings = yaml.safe_load(Path('/bootstrap/http.yaml').read_text())
        validated = CONFIG_SCHEMA({'http': settings})['http']
        hass = HomeAssistant('/config')
        store = await async_get_and_load_store(hass)
        await store.async_migrate_yaml(validated)
        await store.async_activate_config()
        if store.active_config_type is ActiveConfigType.PENDING:
            await store.async_promote_pending()
        await hass.async_block_till_done()
        print('Git-managed HTTP proxy settings confirmed in stable storage.')

    asyncio.run(main())
  install-bambu.py: |
    import hashlib
    import io
    import json
    import os
    from pathlib import Path, PurePosixPath
    import sys
    import tarfile
    import tempfile
    import urllib.request

    COMMIT = 'cd67ed90e08561175a831f35b45773fe427996d7'
    DIGEST = '98ee93523ba5422d669a6545edf8e6d98b1dbd264edca21ea9c92fc0e4fdb2cc'
    VERSION = '2.2.26'

    def files(directory):
      result = {}
      for filename in sorted(directory.rglob('*')):
        if '__pycache__' in filename.parts or filename.name == '.owl-red-install.json':
          continue
        if filename.is_symlink():
          raise RuntimeError('Component symlinks require review.')
        if filename.is_file():
          result[filename.relative_to(directory).as_posix()] = hashlib.sha256(filename.read_bytes()).hexdigest()
      return result

    def main():
      root = Path(sys.argv[1] if len(sys.argv) > 1 else '/config/custom_components')
      destination = root / 'bambu_lab'
      marker = destination / '.owl-red-install.json'
      if destination.is_symlink():
        raise RuntimeError('Unmanaged component location; installation refused.')
      if destination.exists():
        if not marker.is_file():
          raise RuntimeError('Unmanaged Bambu installation; overwrite refused.')
        previous = json.loads(marker.read_text())
        if previous.get('archive_sha256') != DIGEST or previous.get('files') != files(destination):
          raise RuntimeError('Bambu version or files differ; replacement requires review.')
        print(json.dumps({'component': 'bambu_lab', 'version': VERSION, 'changed': False}))
        return
      url = 'https://codeload.github.com/greghesp/ha-bambulab/tar.gz/' + COMMIT
      with urllib.request.urlopen(url, timeout=60) as response:
        archive = response.read(32 * 1024 * 1024 + 1)
      if hashlib.sha256(archive).hexdigest() != DIGEST:
        raise RuntimeError('Bambu archive checksum mismatch; installation refused.')
      root.mkdir(parents=True, exist_ok=True)
      with tempfile.TemporaryDirectory(prefix='.owl-red-bambu-', dir=root) as temporary:
        staged = Path(temporary) / 'bambu_lab'
        staged.mkdir()
        prefix = 'ha-bambulab-' + COMMIT + '/custom_components/bambu_lab/'
        total = 0
        with tarfile.open(fileobj=io.BytesIO(archive), mode='r:gz') as source:
          for member in source:
            if not member.name.startswith(prefix):
              continue
            relative = PurePosixPath(member.name[len(prefix):])
            if relative.is_absolute() or '..' in relative.parts or member.issym() or member.islnk():
              raise RuntimeError('Unsafe Bambu archive member.')
            if member.isdir():
              continue
            total += member.size
            if not member.isfile() or total > 64 * 1024 * 1024:
              raise RuntimeError('Unsupported Bambu archive contents.')
            target = staged.joinpath(*relative.parts)
            target.parent.mkdir(parents=True, exist_ok=True)
            with source.extractfile(member) as contents:
              target.write_bytes(contents.read())
          license_file = source.getmember('ha-bambulab-' + COMMIT + '/LICENSE')
          with source.extractfile(license_file) as contents:
            (staged / 'LICENSE').write_bytes(contents.read())
        manifest_file = staged / 'manifest.json'
        manifest = json.loads(manifest_file.read_text())
        if manifest.get('domain') != 'bambu_lab' or manifest.get('requirements') != ['beautifulsoup4']:
          raise RuntimeError('Unexpected Bambu manifest; installation refused.')
        manifest['version'] = VERSION
        manifest_file.write_text(json.dumps(manifest, indent=2) + '\n')
        (staged / '.owl-red-install.json').write_text(json.dumps({
          'commit': COMMIT, 'archive_sha256': DIGEST, 'version': VERSION, 'files': files(staged)
        }, sort_keys=True) + '\n')
        if destination.exists():
          raise RuntimeError('Concurrent Bambu installation; overwrite refused.')
        os.rename(staged, destination)
      print(json.dumps({'component': 'bambu_lab', 'version': VERSION, 'changed': True}))

    main()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: home-assistant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: home-assistant
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 100
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: install-bambu
          image: ghcr.io/home-assistant/home-assistant:2026.10.2@sha256:33afb0659d786213264c2211f8d91c5fe87461c56eba6a3a546eb05fc71e89f4
          command: [python3, /bootstrap/install-bambu.py]
          env:
            - {name: PYTHONDONTWRITEBYTECODE, value: '1'}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '1', memory: 256Mi}
          volumeMounts:
            - {name: config, mountPath: /config}
            - {name: configuration, mountPath: /bootstrap, readOnly: true}
            - {name: temporary, mountPath: /tmp}
        - name: configure-http
          image: ghcr.io/home-assistant/home-assistant:2026.10.2@sha256:33afb0659d786213264c2211f8d91c5fe87461c56eba6a3a546eb05fc71e89f4
          command: [python3, /bootstrap/configure-http.py]
          env:
            - {name: PYTHONDONTWRITEBYTECODE, value: '1'}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - {name: config, mountPath: /config}
            - {name: configuration, mountPath: /bootstrap, readOnly: true}
            - {name: temporary, mountPath: /tmp}
        - name: prepare-config
          image: busybox:1.37.0
          command:
            - sh
            - -ec
            - |
              umask 007
              if ! test -e /config/automations.yaml; then printf '[]\n' > /config/automations.yaml; fi
              if ! test -e /config/scripts.yaml; then printf '{}\n' > /config/scripts.yaml; fi
              if ! test -e /config/scenes.yaml; then printf '[]\n' > /config/scenes.yaml; fi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 32Mi}
          volumeMounts:
            - {name: config, mountPath: /config}
      containers:
        - name: home-assistant
          image: ghcr.io/home-assistant/home-assistant:2026.10.2@sha256:33afb0659d786213264c2211f8d91c5fe87461c56eba6a3a546eb05fc71e89f4
          command: [python3, -m, homeassistant, --config, /config]
          env:
            - name: TZ
              value: UTC
            - name: HOME
              value: /config
            - name: PYTHONDONTWRITEBYTECODE
              value: '1'
            - name: HOMEASSISTANT_DB_URL
              valueFrom:
                secretKeyRef:
                  name: home-assistant-recorder
                  key: db_url
          ports:
            - {name: http, containerPort: 8123}
          startupProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 30
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: '2', memory: 2Gi}
          volumeMounts:
            - {name: config, mountPath: /config}
            - name: configuration
              mountPath: /config/configuration.yaml
              subPath: configuration.yaml
              readOnly: true
            - {name: temporary, mountPath: /tmp}
      volumes:
        - name: config
          persistentVolumeClaim: {claimName: config}
        - name: configuration
          configMap: {name: home-assistant-config}
        - name: temporary
          emptyDir: {sizeLimit: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  selector:
    app.kubernetes.io/name: home-assistant
  ports:
    - {name: http, port: 8123, targetPort: http}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: administration-access
  namespace: home-assistant
spec:
  ipAllowList:
    sourceRange: [10.0.10.0/24, 10.0.20.10/32]
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  secretName: home-assistant-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames: [ha.owl.red]
  privateKey:
    rotationPolicy: Always
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`ha.owl.red`)
      kind: Rule
      middlewares:
        - name: administration-access
      services:
        - {name: home-assistant, port: 8123}
  tls:
    secretName: home-assistant-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openwrt-luci
  namespace: home-assistant
  labels:
    app.kubernetes.io/component: openwrt-luci
spec:
  secretName: openwrt-luci-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames: [ap.owl.red]
  privateKey:
    rotationPolicy: Always
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: frigate
  namespace: home-assistant
spec:
  secretName: frigate-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames: [nas.owl.red]
  privateKey:
    rotationPolicy: Always