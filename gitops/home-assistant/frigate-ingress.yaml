apiVersion: v1
kind: Service
metadata:
  name: frigate-nas
  namespace: home-assistant
spec:
  ports:
    - {name: https, port: 8971, targetPort: 8971, protocol: TCP}
---
apiVersion: v1
kind: Endpoints
metadata:
  name: frigate-nas
  namespace: home-assistant
subsets:
  - addresses:
      - ip: 10.0.10.5
    ports:
      - {name: https, port: 8971, protocol: TCP}
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: frigate-nas
  namespace: home-assistant
spec:
  serverName: nas.owl.red
  insecureSkipVerify: false
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: frigate-ingress
  namespace: home-assistant
spec:
  secretName: frigate-ingress-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames: [nvr.owl.red]
  privateKey:
    rotationPolicy: Always
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: frigate
  namespace: home-assistant
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`nvr.owl.red`)
      kind: Rule
      middlewares:
        - name: administration-access
      services:
        - {name: frigate-nas, port: 8971, scheme: https, serversTransport: frigate-nas}
  tls:
    secretName: frigate-ingress-tls