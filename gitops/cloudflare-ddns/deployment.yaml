apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflare-ddns
spec:
  replicas: 0
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: cloudflare-ddns}
  template:
    metadata:
      labels: {app.kubernetes.io/name: cloudflare-ddns}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      tolerations:
        - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: updater
          image: ghcr.io/favonia/cloudflare-ddns@sha256:345b41895a8846d74c62d30bd27e61101a754f8ab8da10c68115823883803afb
          env:
            - {name: CLOUDFLARE_API_TOKEN_FILE, value: /run/secrets/cloudflare/api-token}
            - {name: IP4_DOMAINS, value: dash.d0ntb.link}
            - {name: IP4_PROVIDER, value: cloudflare.trace}
            - {name: IP6_PROVIDER, value: none}
            - {name: UPDATE_CRON, value: "@every 5m"}
            - {name: UPDATE_ON_START, value: "true"}
            - {name: DELETE_ON_STOP, value: "false"}
            - {name: PROXIED, value: "true"}
            - {name: TTL, value: "1"}
            - {name: TZ, value: America/Los_Angeles}
            - {name: EMOJI, value: "false"}
            - {name: QUIET, value: "false"}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 200m, memory: 128Mi}
          volumeMounts:
            - {name: cloudflare-token, mountPath: /run/secrets/cloudflare, readOnly: true}
      volumes:
        - name: cloudflare-token
          secret:
            secretName: cloudflare-ddns-credentials
            defaultMode: 0440