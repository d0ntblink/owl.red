apiVersion: v1
kind: Namespace
metadata:
  name: media-apps
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: v1.31
---
apiVersion: v1
kind: PersistentVolume
metadata: {name: tautulli-config-nas}
spec:
  capacity: {storage: 2Gi}
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions: [vers=3.1.1, cache=strict, noserverino, uid=99, gid=100, dir_mode=0770, file_mode=0660]
  claimRef: {namespace: media-apps, name: tautulli-config}
  csi:
    driver: smb.csi.k8s.io
    volumeHandle: nas.owl.red/appdata#tautulli#tautulli-config#retain
    volumeAttributes: {source: //nas.owl.red/appdata, subDir: tautulli}
    nodeStageSecretRef: {name: unraid-smb-credentials, namespace: storage-system}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: tautulli-config, namespace: media-apps}
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: tautulli-config-nas
  resources: {requests: {storage: 2Gi}}
---
apiVersion: v1
kind: PersistentVolume
metadata: {name: reclaimerr-config-nas}
spec:
  capacity: {storage: 2Gi}
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions: [vers=3.1.1, cache=strict, noserverino, uid=99, gid=100, dir_mode=0770, file_mode=0660]
  claimRef: {namespace: media-apps, name: reclaimerr-config}
  csi:
    driver: smb.csi.k8s.io
    volumeHandle: nas.owl.red/appdata#reclaimerr#reclaimerr-config#retain
    volumeAttributes: {source: //nas.owl.red/appdata, subDir: reclaimerr}
    nodeStageSecretRef: {name: unraid-smb-credentials, namespace: storage-system}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: reclaimerr-config, namespace: media-apps}
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: reclaimerr-config-nas
  resources: {requests: {storage: 2Gi}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tautulli-data
  namespace: media-apps
  annotations: {helm.sh/resource-policy: keep}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-appdata
  resources: {requests: {storage: 4Gi}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: reclaimerr-data
  namespace: media-apps
  annotations: {helm.sh/resource-policy: keep}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-appdata
  resources: {requests: {storage: 4Gi}}