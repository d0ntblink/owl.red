apiVersion: v1
kind: Namespace
metadata:
  name: seerr
  annotations:
    helm.sh/resource-policy: keep
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.31
---
apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  name: bw-seerr-database
  namespace: seerr
spec:
  organizationId: 202b0b27-b135-44cd-a969-b43a003ad670
  secretName: seerr-database
  onlyMappedSecrets: true
  map:
    - bwSecretId: cb5f0452-5b01-4b6f-968c-b4ea01683509
      secretKeyName: DB_PASS
  authToken:
    secretName: bw-auth-token
    secretKey: token