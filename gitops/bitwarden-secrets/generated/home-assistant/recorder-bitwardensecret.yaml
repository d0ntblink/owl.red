apiVersion: v1
kind: Namespace
metadata:
  name: home-assistant
  annotations:
    helm.sh/resource-policy: keep
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.31
---
apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  name: bw-home-assistant-recorder
  namespace: home-assistant
spec:
  organizationId: 202b0b27-b135-44cd-a969-b43a003ad670
  secretName: home-assistant-recorder
  onlyMappedSecrets: true
  map:
    - bwSecretId: 89287d09-7152-4158-8390-b4e800f1e3ba
      secretKeyName: db_url
  authToken:
    secretName: bw-auth-token
    secretKey: token