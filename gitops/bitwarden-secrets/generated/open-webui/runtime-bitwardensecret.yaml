apiVersion: v1
kind: Namespace
metadata:
  name: open-webui
  annotations:
    helm.sh/resource-policy: keep
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.31
---
apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  name: bw-open-webui-runtime
  namespace: open-webui
spec:
  organizationId: 202b0b27-b135-44cd-a969-b43a003ad670
  secretName: open-webui-runtime
  onlyMappedSecrets: true
  map:
    - bwSecretId: 43f54fd0-3b42-4edc-ab86-b4ea012ef854
      secretKeyName: DATABASE_URL
    - bwSecretId: e98563d0-e089-45f4-ac0a-b4ea012fce20
      secretKeyName: WEBUI_SECRET_KEY
    - bwSecretId: 4b417f06-ec85-41e5-a201-b4ea012fce52
      secretKeyName: WEBUI_ADMIN_PASSWORD
    - bwSecretId: ceb5f258-2eb4-432d-9664-b4ea012fce84
      secretKeyName: OLLAMA_API_CONFIGS
  authToken:
    secretName: bw-auth-token
    secretKey: token