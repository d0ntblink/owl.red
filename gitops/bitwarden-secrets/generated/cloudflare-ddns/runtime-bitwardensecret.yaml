apiVersion: v1
kind: Namespace
metadata:
  name: cloudflare-ddns
  annotations: {helm.sh/resource-policy: keep}
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.31
---
apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  name: bw-cloudflare-ddns-credentials
  namespace: cloudflare-ddns
spec:
  organizationId: 202b0b27-b135-44cd-a969-b43a003ad670
  secretName: cloudflare-ddns-credentials
  onlyMappedSecrets: true
  map:
    - bwSecretId: 13156aec-e757-4911-b9a0-b4e80035e770
      secretKeyName: api-token
  authToken:
    secretName: bw-auth-token
    secretKey: token