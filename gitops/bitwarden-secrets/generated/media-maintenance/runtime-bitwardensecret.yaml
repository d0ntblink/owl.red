apiVersion: v1
kind: Namespace
metadata:
  name: media-maintenance
  annotations: {helm.sh/resource-policy: keep}
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.31
---
apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  name: bw-plex-maintenance-runtime
  namespace: media-maintenance
spec:
  organizationId: 202b0b27-b135-44cd-a969-b43a003ad670
  secretName: plex-maintenance-runtime
  onlyMappedSecrets: true
  map:
    - bwSecretId: d1c34bdb-f269-4723-ae74-b4f601709440
      secretKeyName: PLEX_TOKEN
    - bwSecretId: e0e521e0-3c99-4084-84c3-b4f6016c561f
      secretKeyName: TMDB_API_KEY
    - bwSecretId: 1311a600-2ed8-44d9-9072-b4f6016c3adf
      secretKeyName: TMDB_READ_TOKEN
    - bwSecretId: 53e5a19c-23c8-406b-b57d-b4f60177590e
      secretKeyName: MDBLIST_API_KEY
  authToken:
    secretName: bw-auth-token
    secretKey: token