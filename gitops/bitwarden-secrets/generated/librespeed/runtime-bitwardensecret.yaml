apiVersion: v1
kind: Namespace
metadata:
  name: librespeed
  annotations: {helm.sh/resource-policy: keep}
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: v1.31
---
apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata: {name: bw-librespeed-runtime, namespace: librespeed}
spec:
  organizationId: 202b0b27-b135-44cd-a969-b43a003ad670
  secretName: librespeed-runtime
  onlyMappedSecrets: true
  map:
    - bwSecretId: 4713a398-4a0a-42f4-9f34-b4eb0023fa1a
      secretKeyName: DB_PASSWORD
    - bwSecretId: de7c96d0-0263-452c-bc48-b4eb00248c96
      secretKeyName: PASSWORD
  authToken:
    secretName: bw-auth-token
    secretKey: token