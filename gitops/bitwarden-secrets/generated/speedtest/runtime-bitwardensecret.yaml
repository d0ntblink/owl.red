apiVersion: v1
kind: Namespace
metadata:
  name: speedtest
  annotations:
    helm.sh/resource-policy: keep
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: v1.31
---
apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  name: bw-speedtest-runtime
  namespace: speedtest
spec:
  organizationId: 202b0b27-b135-44cd-a969-b43a003ad670
  secretName: speedtest-runtime
  onlyMappedSecrets: true
  map:
    - bwSecretId: e9b57c56-81bd-4d10-83fb-b4eb00117f55
      secretKeyName: DB_PASSWORD
    - bwSecretId: 0f3d37f1-5334-4968-a89c-b4eb001230f9
      secretKeyName: APP_KEY
    - bwSecretId: 423fc030-a477-4605-b4c5-b4eb00123205
      secretKeyName: ADMIN_PASSWORD
  authToken:
    secretName: bw-auth-token
    secretKey: token