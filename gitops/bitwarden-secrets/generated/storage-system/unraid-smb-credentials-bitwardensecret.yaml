apiVersion: v1
kind: Namespace
metadata:
  name: storage-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: v1.31
---
apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  name: bw-unraid-smb-credentials
  namespace: storage-system
spec:
  organizationId: "202b0b27-b135-44cd-a969-b43a003ad670"
  secretName: unraid-smb-credentials
  onlyMappedSecrets: true
  map:
    - bwSecretId: "68f60099-26fc-400a-989d-b4e701425fbf"
      secretKeyName: username
    - bwSecretId: "b345a61f-0a53-4379-896d-b4e701426020"
      secretKeyName: password
  authToken:
    secretName: bw-auth-token
    secretKey: token