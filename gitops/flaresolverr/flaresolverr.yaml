apiVersion: v1
kind: Namespace
metadata:
  name: flaresolverr
  annotations:
    helm.sh/resource-policy: keep
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.31
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flaresolverr
  namespace: flaresolverr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: flaresolverr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flaresolverr
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: flaresolverr
          image: ghcr.io/flaresolverr/flaresolverr:v3.5.2@sha256:c80ae007ce2ccdcd217a12426e4f039ef763ff90738c808d38810c3e59323767
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {cpu: "1", memory: 1Gi}
          ports:
            - {name: http, containerPort: 8191}
          env:
            - {name: LOG_LEVEL, value: info}
            - {name: LOG_HTML, value: "false"}
            - {name: TZ, value: UTC}
          startupProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 30
          volumeMounts:
            - {name: config, mountPath: /config}
            - {name: temporary, mountPath: /tmp}
            - {name: shared-memory, mountPath: /dev/shm}
      volumes:
        - name: config
          emptyDir: {sizeLimit: 256Mi}
        - name: temporary
          emptyDir: {sizeLimit: 512Mi}
        - name: shared-memory
          emptyDir: {medium: Memory, sizeLimit: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: flaresolverr
  namespace: flaresolverr
  annotations:
    metallb.io/loadBalancerIPs: 10.0.10.202
spec:
  type: LoadBalancer
  loadBalancerSourceRanges: [10.0.10.5/32]
  selector:
    app.kubernetes.io/name: flaresolverr
  ports:
    - {name: http, port: 8191, targetPort: http}