apiVersion: v1
kind: ConfigMap
metadata:
  name: kometa-config
data:
  config.yml: |
    plex:
      url: http://10.0.10.5:32400
      token: <<plextoken>>
      timeout: 60
      clean_bundles: false
      empty_trash: false
      optimize: false
      verify_ssl: true
    tmdb:
      apikey: <<tmdbkey>>
      language: en
      region: CA
      cache_expiration: 60
    mdblist:
      apikey: <<mdblistkey>>
      cache_expiration: 60
    libraries:
      Movies: &movies
        settings:
          asset_directory: /assets/Movies
        collection_files:
          - default: basic
          - default: imdb
          - default: tmdb
          - default: genre
          - default: decade
          - default: franchise
          - default: studio
          - default: oscars
          - default: seasonal
        overlay_files:
          - default: aspect
            template_variables:
              horizontal_align: left
              vertical_align: top
              vertical_offset: 517
          - default: audio_codec
          - default: language_count
          - default: content_rating_us_movie
            template_variables:
              horizontal_align: left
              vertical_align: top
              vertical_offset: 637
          - default: languages
          - default: languages
            template_variables:
              back_color: "#FFFFFF00"
              font_color: "#FFFFFF00"
              use_subtitles: true
          - default: mediastinger
          - default: ratings
            template_variables:
              rating1: mdb_tomatoes
              rating1_image: rt_tomato
              rating1_font: fonts/Arimo-Bold.ttf
              rating1_font_size: 63
              rating2: imdb
              rating2_image: imdb
              rating2_font: fonts/LibreFranklin-Black.ttf
              rating2_font_size: 70
              rating3: tmdb
              rating3_image: tmdb
              rating3_font: fonts/Figtree-Black.ttf
              rating3_font_size: 70
              horizontal_position: right
          - default: resolution
          - default: studio
            template_variables:
              horizontal_align: left
              vertical_align: top
              vertical_offset: 877
          - default: versions
          - default: video_format
      Shows: &shows
        settings:
          asset_directory: /assets/Shows
        collection_files:
          - default: basic
          - default: imdb
          - default: tmdb
          - default: genre
          - default: decade
          - default: network
          - default: franchise
        overlay_files:
          - default: aspect
            template_variables:
              horizontal_align: left
              vertical_align: top
              vertical_offset: 510
          - default: audio_codec
            template_variables:
              vertical_offset: 95
          - default: content_rating_us_show
            template_variables:
              horizontal_align: left
              vertical_align: top
              vertical_offset: 630
          - default: studio
            template_variables:
              horizontal_align: left
              vertical_align: top
              vertical_offset: 870
          - default: language_count
          - default: languages
          - default: languages
            template_variables:
              use_subtitles: true
          - default: network
            template_variables:
              horizontal_align: left
              vertical_align: top
              vertical_offset: 990
          - default: ratings
            template_variables:
              rating1: mdb_tomatoes
              rating1_image: rt_tomato
              rating1_font: fonts/Arimo-Bold.ttf
              rating1_font_size: 63
              rating2: imdb
              rating2_image: imdb
              rating2_font: fonts/LibreFranklin-Black.ttf
              rating2_font_size: 70
              rating3: tmdb
              rating3_image: tmdb
              rating3_font: fonts/Figtree-Black.ttf
              rating3_font_size: 70
              horizontal_position: right
          - default: resolution
            template_variables:
              vertical_offset: 95
          - default: status
            template_variables:
              horizontal_align: center
              vertical_align: top
              vertical_offset: 0
              horizontal_offset: 0
              back_height: 85
              back_width: 1100
              font: fonts/Figtree-Black.ttf
              font_size: 60
              back_color_airing: "#016920"
              back_color_returning: "#81007F"
              back_color_canceled: "#B52222"
              back_color_ended: "#000847"
          - default: versions
          - default: video_format
      4K Movies:
        <<: *movies
        settings:
          asset_directory: /assets/4K Movies
      4K Shows:
        <<: *shows
        settings:
          asset_directory: /assets/4K Shows
    settings:
      run_order:
        - collections
        - overlays
      cache: true
      cache_expiration: 60
      asset_folders: true
      create_asset_folders: false
      prioritize_assets: true
      download_url_assets: false
      sync_mode: append
      minimum_items: 2
      delete_below_minimum: false
      delete_not_scheduled: false
      show_missing: false
      save_report: true
      verify_ssl: true
      overlay_artwork_filetype: jpg
      overlay_artwork_quality: 90
  run.py: |
      import hashlib
      import io
      import json
      import os
      from pathlib import Path
      import shutil
      import subprocess
      import sys
      import tempfile
      import uuid

      from PIL import Image
      from plexapi.server import PlexServer
      import requests
      from ruamel.yaml import YAML

      MEDIA_ROOTS = {"Movies": Path("/media/Movies"), "4K Movies": Path("/media/Movies-uhd"), "Shows": Path("/media/Shows"), "4K Shows": Path("/media/Shows-uhd")}

      def digest(filename):
        return hashlib.sha256(filename.read_bytes()).hexdigest()

      def poster_digest(filename):
        if filename.is_symlink() or (filename.exists() and not filename.is_file()):
          raise RuntimeError("Local poster is not a regular file")
        return digest(filename) if filename.exists() else None

      def plan(items, media_root, kind="movie"):
        root = media_root.resolve(strict=True)
        if kind not in ("movie", "show"):
          raise RuntimeError("Unexpected library type")
        result = []
        skipped = []
        directories = {}
        asset_names = {}
        for item in items:
          key = str(item.ratingKey)
          try:
            if kind == "show":
              locations = [Path(location) for location in item.locations]
            else:
              locations = [Path(part.file).parent for media in item.media for part in media.parts]
            if not locations or len(set(locations)) != 1:
              raise RuntimeError("Missing or ambiguous media folder")
            directory = locations[0]
            if root not in directory.parents:
              raise RuntimeError("Item is outside an individual media folder")
            if any(parent.is_symlink() for parent in (directory, *directory.parents) if parent != root and root in parent.parents):
              raise RuntimeError("Symlinked media folder refused")
            directory = directory.resolve(strict=True)
            if root not in directory.parents or not directory.is_dir():
              raise RuntimeError("Invalid media folder")
            directories[directory] = directories.get(directory, 0) + 1
            asset_names[directory.name] = asset_names.get(directory.name, 0) + 1
            poster = directory / "poster.jpg"
            result.append({"key": key, "poster": poster, "before": poster_digest(poster)})
          except (RuntimeError, OSError) as error:
            skipped.append({"key": key, "reason": str(error)})
        unique = []
        for item in result:
          if directories[item["poster"].parent] != 1 or asset_names[item["poster"].parent.name] != 1:
            skipped.append({"key": item["key"], "reason": "Items share a poster directory or clean-asset name"})
          else:
            unique.append(item)
        return unique, skipped

      def replace_poster(target, source, expected):
        if poster_digest(target) != expected:
          raise RuntimeError("Local artwork changed since preflight")
        temporary = None
        try:
          with tempfile.NamedTemporaryFile(dir=target.parent, prefix=".poster-", suffix=".jpg", delete=False) as output:
            temporary = Path(output.name)
            output.write(source.read_bytes())
            output.flush()
            os.fsync(output.fileno())
          temporary.chmod(0o664)
          if poster_digest(target) != expected:
            raise RuntimeError("Local artwork changed during export")
          os.replace(temporary, target)
        finally:
          if temporary is not None:
            temporary.unlink(missing_ok=True)

      def run_library(server, name, arguments):
        library = server.library.section(name)
        kind = "show" if name in ("Shows", "4K Shows") else "movie"
        if library.type != kind:
          raise RuntimeError("Unexpected library type")
        items = library.all()
        if kind == "show":
          for item in items:
            item.reload()
        planned, pending = plan(items, MEDIA_ROOTS[name], kind)
        ready = []
        for item in planned:
          clean = Path("/assets") / name / item["poster"].parent.name / "poster.jpg"
          if not clean.is_file() or clean.is_symlink() or clean.parent.is_symlink():
            pending.append({"key": item["key"], "reason": "Clean Posterizarr asset missing"})
          else:
            ready.append(item)
        run = Path("/assetsbackup/local-posters") / uuid.uuid4().hex
        run.mkdir(parents=True, mode=0o700)
        journal = {"library": name, "items": [], "exported": [], "unchanged": [], "pending": pending, "complete": False}
        for item in ready:
          journal["items"].append({"key": item["key"], "poster": str(item["poster"]), "before": item["before"]})
        manifest = run / "manifest.json"
        manifest.write_text(json.dumps(journal, indent=2))
        native_arguments = list(arguments)
        native_arguments[native_arguments.index("--libraries") + 1] = name
        subprocess.run([sys.executable, "/kometa.py", *native_arguments], check=True)
        with requests.Session() as session:
          session.headers["X-Plex-Token"] = os.environ["KOMETA_PLEXTOKEN"]
          for item in ready:
            try:
              refreshed = server.fetchItem(int(item["key"]))
              current, rejected = plan([refreshed], MEDIA_ROOTS[name], kind)
              if rejected or len(current) != 1 or current[0]["poster"] != item["poster"] or current[0]["before"] != item["before"]:
                raise RuntimeError("Media path or local artwork changed during run")
              if not any(label.tag.lower() == "overlay" for label in refreshed.labels):
                raise RuntimeError("Kometa overlay label missing")
              if not refreshed.thumb or not refreshed.thumb.startswith("/library/metadata/"):
                raise RuntimeError("Unexpected selected artwork path")
              response = session.get(server._baseurl + refreshed.thumb, timeout=60)
              response.raise_for_status()
              with Image.open(io.BytesIO(response.content)) as image:
                if image.format != "JPEG" or image.width < 300 or image.height < 450:
                  raise RuntimeError("Selected artwork is not a valid poster JPEG")
                image.verify()
              if hashlib.sha256(response.content).hexdigest() == item["before"]:
                journal["unchanged"].append(item["key"])
              else:
                finished = run / (item["key"] + ".finished.jpg")
                finished.write_bytes(response.content)
                if item["before"] is not None:
                  shutil.copyfile(item["poster"], run / (item["key"] + ".before.jpg"))
                replace_poster(item["poster"], finished, item["before"])
                journal["exported"].append(item["key"])
            except Exception as error:
              journal["pending"].append({"key": item["key"], "reason": type(error).__name__})
            manifest.write_text(json.dumps(journal, indent=2))
        journal["complete"] = True
        manifest.write_text(json.dumps(journal, indent=2))
        print(json.dumps({"library": name, "finishedLocalPosters": len(journal["exported"]) + len(journal["unchanged"]), "pendingLocalPosters": len(journal["pending"]), "manifest": str(manifest)}), flush=True)

      def main():
        arguments = sys.argv[1:]
        if "--libraries" not in arguments or "--overlays-only" not in arguments:
          raise RuntimeError("Explicit video libraries and overlays-only are required")
        names = arguments[arguments.index("--libraries") + 1].split("|")
        if not names or len(names) != len(set(names)) or any(name not in MEDIA_ROOTS for name in names):
          raise RuntimeError("Unexpected artwork libraries")
        configuration = YAML(typ="safe").load(Path("/config/config.yml").read_text())
        for name in names:
          if configuration["libraries"][name].get("settings", {}).get("asset_directory") != str(Path("/assets") / name):
            raise RuntimeError("Native library clean-asset mapping is missing")
        server = PlexServer("http://10.0.10.5:32400", os.environ["KOMETA_PLEXTOKEN"], timeout=180)
        failed = []
        for name in names:
          try:
            run_library(server, name, arguments)
          except Exception:
            failed.append(name)
            print(json.dumps({"library": name, "failed": True}), flush=True)
        if failed:
          raise RuntimeError("Artwork libraries failed; completed sidecars retained")

      if __name__ == "__main__":
        try:
          main()
        except Exception:
          print("Artwork run stopped. Completed posters and native caches are retained; inspect the run manifests.", file=sys.stderr)
          sys.exit(1)