apiVersion: v1
kind: ConfigMap
metadata:
  name: kometa-config
data:
  config.yml: |
    plex:
      url: http://10.0.10.5:32400
      token: <<plextoken>>
      timeout: 60
      clean_bundles: false
      empty_trash: false
      optimize: false
      verify_ssl: true
    tmdb:
      apikey: <<tmdbkey>>
      language: en
      region: CA
      cache_expiration: 60
    mdblist:
      apikey: <<mdblistkey>>
      cache_expiration: 60
    playlist_files:
      - default: playlist
        template_variables:
          libraries: [Movies, 4K Movies, Shows, 4K Shows]
          delete_playlist: false
    libraries: {}
    settings:
      run_order:
        - collections
        - overlays
      cache: true
      cache_expiration: 60
      asset_folders: true
      create_asset_folders: false
      prioritize_assets: true
      download_url_assets: false
      sync_mode: append
      minimum_items: 2
      delete_below_minimum: false
      delete_not_scheduled: false
      show_missing: false
      save_report: true
      playlist_sync_to_users: []
      verify_ssl: true
      overlay_artwork_filetype: jpg
      overlay_artwork_quality: 90
  run.py: |
      import hashlib
      import io
      import json
      import os
      from pathlib import Path
      import shutil
      import subprocess
      import sys
      import tempfile
      import uuid

      from PIL import Image
      from plexapi.server import PlexServer
      import requests
      from ruamel.yaml import YAML

      MEDIA_ROOTS = {"Movies": Path("/media/Movies"), "4K Movies": Path("/media/Movies-uhd"), "Shows": Path("/media/Shows"), "4K Shows": Path("/media/Shows-uhd")}
      LIBRARY_FILES = {"Movies": "movies.yml", "4K Movies": "4k-movies.yml", "Shows": "shows.yml", "4K Shows": "4k-shows.yml"}

      def load_configuration(base, library_directory):
        parser = YAML(typ="safe")
        configuration = parser.load(base.read_text())
        configuration["libraries"] = {}
        for name, filename in LIBRARY_FILES.items():
          library = parser.load((library_directory / filename).read_text())
          if not isinstance(library, dict) or library.get("settings", {}).get("asset_directory") != str(Path("/assets") / name):
            raise RuntimeError("Native library clean-asset mapping is missing")
          configuration["libraries"][name] = library
        return configuration

      def digest(filename):
        return hashlib.sha256(filename.read_bytes()).hexdigest()

      def poster_digest(filename):
        if filename.is_symlink() or (filename.exists() and not filename.is_file()):
          raise RuntimeError("Local poster is not a regular file")
        return digest(filename) if filename.exists() else None

      def plan(items, media_root, kind="movie"):
        root = media_root.resolve(strict=True)
        if kind not in ("movie", "show", "episode"):
          raise RuntimeError("Unexpected library type")
        result = []
        skipped = []
        targets = {}
        asset_names = {}
        for item in items:
          key = str(item.ratingKey)
          try:
            if kind == "show":
              locations = [Path(location) for location in item.locations]
            else:
              files = [Path(part.file) for media in item.media for part in media.parts]
              if kind == "episode" and (len(files) != 1 or files[0].is_symlink() or not files[0].is_file()):
                raise RuntimeError("Missing, symlinked or multipart episode refused")
              locations = [filename.parent for filename in files]
            if not locations or len(set(locations)) != 1:
              raise RuntimeError("Missing or ambiguous media folder")
            directory = locations[0]
            if root not in directory.parents:
              raise RuntimeError("Item is outside an individual media folder")
            if any(parent.is_symlink() for parent in (directory, *directory.parents) if parent != root and root in parent.parents):
              raise RuntimeError("Symlinked media folder refused")
            directory = directory.resolve(strict=True)
            if root not in directory.parents or not directory.is_dir():
              raise RuntimeError("Invalid media folder")
            asset_names[directory.name] = asset_names.get(directory.name, 0) + 1
            poster = directory / (files[0].stem + "-thumb.jpg" if kind == "episode" else "poster.jpg")
            targets[poster] = targets.get(poster, 0) + 1
            media_before = None
            if kind == "episode":
              status = files[0].stat()
              media_before = (status.st_size, status.st_mtime_ns)
            result.append({"key": key, "kind": kind, "poster": poster, "before": poster_digest(poster), "media_before": media_before})
          except (RuntimeError, OSError) as error:
            skipped.append({"key": key, "kind": kind, "reason": str(error)})
        unique = []
        for item in result:
          if targets[item["poster"]] != 1 or (kind != "episode" and asset_names[item["poster"].parent.name] != 1):
            skipped.append({"key": item["key"], "kind": kind, "reason": "Items share an artwork target or clean-asset name"})
          else:
            unique.append(item)
        return unique, skipped

      def validate_artwork(image, kind):
        minimum_height = 150 if kind == "episode" else 450
        if image.format != "JPEG" or image.width < 300 or image.height < minimum_height:
          raise RuntimeError("Selected artwork is not a valid JPEG")
        if kind == "episode" and image.width <= image.height:
          raise RuntimeError("Episode thumbnail is not landscape")

      def replace_poster(target, source, expected):
        if poster_digest(target) != expected:
          raise RuntimeError("Local artwork changed since preflight")
        temporary = None
        try:
          with tempfile.NamedTemporaryFile(dir=target.parent, prefix=".poster-", suffix=".jpg", delete=False) as output:
            temporary = Path(output.name)
            output.write(source.read_bytes())
            output.flush()
            os.fsync(output.fileno())
          temporary.chmod(0o664)
          if poster_digest(target) != expected:
            raise RuntimeError("Local artwork changed during export")
          os.replace(temporary, target)
        finally:
          if temporary is not None:
            temporary.unlink(missing_ok=True)

      def run_library(server, name, arguments):
        library = server.library.section(name)
        kind = "show" if name in ("Shows", "4K Shows") else "movie"
        if library.type != kind:
          raise RuntimeError("Unexpected library type")
        items = library.all()
        if kind == "show":
          for item in items:
            item.reload()
        planned, pending = plan(items, MEDIA_ROOTS[name], kind)
        if kind == "show":
          episodes, episode_pending = plan(library.search(libtype="episode"), MEDIA_ROOTS[name], "episode")
          planned.extend(episodes)
          pending.extend(episode_pending)
        ready = []
        for item in planned:
          if item["kind"] == "episode":
            ready.append(item)
            continue
          clean = Path("/assets") / name / item["poster"].parent.name / "poster.jpg"
          if not clean.is_file() or clean.is_symlink() or clean.parent.is_symlink():
            pending.append({"key": item["key"], "kind": kind, "reason": "Clean Posterizarr asset missing"})
          else:
            ready.append(item)
        run = Path("/assetsbackup/local-posters") / uuid.uuid4().hex
        run.mkdir(parents=True, mode=0o700)
        journal = {"library": name, "items": [], "exported": [], "unchanged": [], "pending": pending, "complete": False}
        for item in ready:
          journal["items"].append({"key": item["key"], "kind": item["kind"], "poster": str(item["poster"]), "before": item["before"], "media_before": item["media_before"]})
        manifest = run / "manifest.json"
        manifest.write_text(json.dumps(journal, indent=2))
        native_arguments = list(arguments)
        native_arguments[native_arguments.index("--libraries") + 1] = name
        subprocess.run([sys.executable, "/kometa.py", *native_arguments], check=True)
        with requests.Session() as session:
          session.headers["X-Plex-Token"] = os.environ["KOMETA_PLEXTOKEN"]
          for item in ready:
            try:
              refreshed = server.fetchItem(int(item["key"]))
              current, rejected = plan([refreshed], MEDIA_ROOTS[name], item["kind"])
              if rejected or len(current) != 1 or any(current[0][field] != item[field] for field in ("poster", "before", "media_before")):
                raise RuntimeError("Media path or local artwork changed during run")
              if not any(label.tag.lower() == "overlay" for label in refreshed.labels):
                raise RuntimeError("Kometa overlay label missing")
              if not refreshed.thumb or not refreshed.thumb.startswith("/library/metadata/"):
                raise RuntimeError("Unexpected selected artwork path")
              response = session.get(server._baseurl + refreshed.thumb, timeout=60)
              response.raise_for_status()
              with Image.open(io.BytesIO(response.content)) as image:
                validate_artwork(image, item["kind"])
                image.verify()
              if hashlib.sha256(response.content).hexdigest() == item["before"]:
                journal["unchanged"].append(item["key"])
              else:
                finished = run / (item["key"] + ".finished.jpg")
                finished.write_bytes(response.content)
                if item["before"] is not None:
                  shutil.copyfile(item["poster"], run / (item["key"] + ".before.jpg"))
                replace_poster(item["poster"], finished, item["before"])
                journal["exported"].append(item["key"])
            except Exception as error:
              journal["pending"].append({"key": item["key"], "kind": item["kind"], "reason": type(error).__name__})
            manifest.write_text(json.dumps(journal, indent=2))
        journal["complete"] = True
        manifest.write_text(json.dumps(journal, indent=2))
        finished = set(journal["exported"] + journal["unchanged"])
        poster_keys = {item["key"] for item in ready if item["kind"] != "episode"}
        episode_keys = {item["key"] for item in ready if item["kind"] == "episode"}
        print(json.dumps({"library": name, "finishedLocalPosters": len(finished & poster_keys), "finishedLocalThumbnails": len(finished & episode_keys), "pendingLocalPosters": sum(item.get("kind") != "episode" for item in journal["pending"]), "pendingLocalThumbnails": sum(item.get("kind") == "episode" for item in journal["pending"]), "manifest": str(manifest)}), flush=True)

      def main():
        arguments = sys.argv[1:]
        if "--libraries" not in arguments:
          raise RuntimeError("Explicit video libraries are required")
        names = arguments[arguments.index("--libraries") + 1].split("|")
        if not names or len(names) != len(set(names)) or any(name not in MEDIA_ROOTS for name in names):
          raise RuntimeError("Unexpected artwork libraries")
        configuration = load_configuration(Path("/config/config.yml"), Path("/libraries"))
        playlist_files = configuration.pop("playlist_files", None)
        with Path("/config/config.yml").open("w") as output:
          YAML().dump(configuration, output)
        server = PlexServer("http://10.0.10.5:32400", os.environ["KOMETA_PLEXTOKEN"], timeout=180)
        failed = []
        for name in names:
          try:
            run_library(server, name, arguments)
          except Exception:
            failed.append(name)
            print(json.dumps({"library": name, "failed": True}), flush=True)
        if failed:
          raise RuntimeError("Artwork libraries failed; completed sidecars retained")
        if playlist_files and "--overlays-only" not in arguments and set(names) == set(MEDIA_ROOTS):
          configuration["playlist_files"] = playlist_files
          with Path("/config/config.yml").open("w") as output:
            YAML().dump(configuration, output)
          playlist_arguments = list(arguments)
          library_index = playlist_arguments.index("--libraries")
          del playlist_arguments[library_index:library_index + 2]
          subprocess.run([sys.executable, "/kometa.py", *playlist_arguments, "--playlists-only"], check=True)

      if __name__ == "__main__":
        try:
          main()
        except Exception:
          print("Artwork run stopped. Completed posters and native caches are retained; inspect the run manifests.", file=sys.stderr)
          sys.exit(1)