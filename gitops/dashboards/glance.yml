server:
  port: 8080
  proxied: true
branding:
  logo-text: owl's nest
  app-name: home.owl.red
theme:
  background-color: 240 21 15
  primary-color: 267 84 81
  positive-color: 115 54 76
  negative-color: 343 81 75
  contrast-multiplier: 1.2
  presets:
    catppuccin-latte:
      light: true
      background-color: 220 23 95
      primary-color: 266 85 58
      positive-color: 109 58 40
      negative-color: 347 87 44
pages:
  - name: apps
    width: wide
    head-widgets:
      - type: search
        search-engine: duckduckgo
        new-tab: true
    columns:
      - size: full
        widgets:
          - type: monitor
            title: Core Platform
            cache: 1m
            sites:
              - title: Rancher
                url: https://rancher.owl.red
                check-url: http://rancher.cattle-system.svc.cluster.local/ping
                icon: di:rancher
              - title: Home Assistant
                url: https://ha.owl.red
                check-url: http://home-assistant.home-assistant.svc.cluster.local:8123/
                icon: di:home-assistant
              - title: Technitium DNS
                url: https://dns.owl.red
                check-url: http://technitium.technitium.svc.cluster.local:5380/
                icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/technitium.png
              - title: Open WebUI
                url: https://ai.owl.red
                check-url: https://nas.owl.red:11436/health
                icon: di:open-webui
              - title: Gatus
                url: https://gatus.owl.red
                check-url: http://gatus.gatus.svc.cluster.local/health
                icon: di:gatus
          - type: bookmarks
            title: Administration
            groups:
              - links:
                  - title: Traefik
                    url: https://traefik.owl.red/dashboard/
                    icon: di:traefik
          - type: monitor
            title: Media
            cache: 1m
            sites:
              - title: Plex
                url: http://nas.owl.red:32400/web
                check-url: http://nas.owl.red:32400/identity
                icon: di:plex
              - title: Jellyfin
                url: https://jellyfin.owl.red
                check-url: http://nas.owl.red:8096/health
                icon: di:jellyfin
              - title: Seerr
                url: https://seerr.owl.red
                check-url: http://seerr.seerr.svc.cluster.local:5055/api/v1/status
                icon: di:overseerr
              - title: Bazarr
                url: https://bazarr.owl.red
                check-url: http://bazarr.arr.svc.cluster.local:6767/
                icon: di:bazarr
              - title: qBittorrent
                url: https://qbittorrent.owl.red
                check-url: http://qbittorrent.qbittorrent.svc.cluster.local:8080/
                icon: di:qbittorrent
              - title: Tautulli
                url: https://tautulli.owl.red
