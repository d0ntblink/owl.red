apiVersion: v1
kind: PersistentVolume
metadata:
  name: slskd-config-nas
spec:
  capacity: {storage: 2Gi}
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions: [vers=3.1.1, cache=strict, noserverino, uid=1654, gid=100, dir_mode=0770, file_mode=0660]
  claimRef: {namespace: qbittorrent, name: slskd-config}
  csi:
    driver: smb.csi.k8s.io
    volumeHandle: nas.owl.red/appdata#slskd#slskd-config#retain
    volumeAttributes: {source: //nas.owl.red/appdata, subDir: slskd}
    nodeStageSecretRef: {name: unraid-smb-credentials, namespace: storage-system}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: slskd-config, namespace: qbittorrent}
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: slskd-config-nas
  resources: {requests: {storage: 2Gi}}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: soularr-config-nas
spec:
  capacity: {storage: 1Gi}
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions: [vers=3.1.1, cache=strict, noserverino, uid=99, gid=100, dir_mode=0770, file_mode=0660]
  claimRef: {namespace: qbittorrent, name: soularr-config}
  csi:
    driver: smb.csi.k8s.io
    volumeHandle: nas.owl.red/appdata#soularr#soularr-config#retain
    volumeAttributes: {source: //nas.owl.red/appdata, subDir: soularr}
    nodeStageSecretRef: {name: unraid-smb-credentials, namespace: storage-system}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: soularr-config, namespace: qbittorrent}
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: soularr-config-nas
  resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: slskd-data
  namespace: qbittorrent
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-appdata
  resources: {requests: {storage: 2Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: slskd, namespace: qbittorrent}
spec:
  selector: {app.kubernetes.io/name: qbittorrent}
  ports: [{name: http, port: 5030, targetPort: 5030}]
---
apiVersion: v1
kind: Service
metadata: {name: soularr, namespace: qbittorrent}
spec:
  selector: {app.kubernetes.io/name: qbittorrent}
  ports: [{name: http, port: 8265, targetPort: 8265}]
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: {name: slskd, namespace: qbittorrent}
spec:
  secretName: slskd-tls
  issuerRef: {name: letsencrypt-prod, kind: ClusterIssuer}
  dnsNames: [slskd.owl.red]
  privateKey: {rotationPolicy: Always}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: {name: soularr, namespace: qbittorrent}
spec:
  secretName: soularr-tls
  issuerRef: {name: letsencrypt-prod, kind: ClusterIssuer}
  dnsNames: [soularr.owl.red]
  privateKey: {rotationPolicy: Always}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: {name: slskd, namespace: qbittorrent}
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`slskd.owl.red`)
      kind: Rule
      middlewares: [{name: administration-access}]
      services: [{name: slskd, port: 5030}]
  tls: {secretName: slskd-tls}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: {name: soularr, namespace: qbittorrent}
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`soularr.owl.red`)
      kind: Rule
      middlewares: [{name: administration-access}]
      services: [{name: soularr, port: 8265}]
  tls: {secretName: soularr-tls}