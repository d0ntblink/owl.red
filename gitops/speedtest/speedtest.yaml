apiVersion: v1
kind: PersistentVolume
metadata: {name: speedtest-config-nas}
spec:
  capacity: {storage: 2Gi}
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions: [vers=3.1.1, cache=strict, noserverino, uid=1001, gid=100, dir_mode=0770, file_mode=0660]
  claimRef: {namespace: speedtest, name: config}
  csi:
    driver: smb.csi.k8s.io
    volumeHandle: nas.owl.red/appdata#speedtest-tracker-v2#speedtest-config#retain
    volumeAttributes: {source: //nas.owl.red/appdata, subDir: speedtest-tracker-v2}
    nodeStageSecretRef: {name: unraid-smb-credentials, namespace: storage-system}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: config, namespace: speedtest}
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: speedtest-config-nas
  resources: {requests: {storage: 2Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: speedtest, namespace: speedtest}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: speedtest}
  template:
    metadata:
      labels: {app.kubernetes.io/name: speedtest}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      tolerations:
        - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: speedtest
          image: linuxserver/speedtest-tracker@sha256:7f296f2f4f3fbc5ad7281a83743d3342a7ff143b9f382f0c8e87bdf5a4b29438
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [NET_RAW]}
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {cpu: "2", memory: 1Gi}
          envFrom:
            - secretRef: {name: speedtest-runtime}
          env:
            - {name: PUID, value: "1001"}
            - {name: PGID, value: "100"}
            - {name: UMASK, value: "002"}
            - {name: TZ, value: America/Edmonton}
            - {name: DISPLAY_TIMEZONE, value: America/Edmonton}
            - {name: APP_URL, value: "https://speedtest.owl.red"}
            - {name: APP_ENV, value: production}
            - {name: APP_DEBUG, value: "false"}
            - {name: ASSET_URL, value: "https://speedtest.owl.red"}
            - {name: DB_CONNECTION, value: pgsql}
            - {name: DB_HOST, value: nas.owl.red}
            - {name: DB_PORT, value: "15432"}
            - {name: DB_DATABASE, value: speedtest}
            - {name: DB_USERNAME, value: speedtest}
            - {name: ADMIN_NAME, value: Admin}
            - {name: ADMIN_EMAIL, value: admin@owl.red}
            - {name: SPEEDTEST_SCHEDULE, value: "0 */6 * * *"}
            - {name: PRUNE_RESULTS_OLDER_THAN, value: "0"}
            - {name: PUBLIC_DASHBOARD, value: "false"}
          ports: [{name: http, containerPort: 80}]
          startupProbe:
            httpGet: {path: /up, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /up, port: http}
            periodSeconds: 10
          volumeMounts:
            - {name: config, mountPath: /config}
      volumes:
        - {name: config, persistentVolumeClaim: {claimName: config}}
---
apiVersion: v1
kind: Service
metadata: {name: speedtest, namespace: speedtest}
spec:
  selector: {app.kubernetes.io/name: speedtest}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: administration-access, namespace: speedtest}
spec:
  ipAllowList:
    sourceRange: [10.0.10.0/24, 10.0.20.10/32]
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: {name: speedtest, namespace: speedtest}
spec:
  secretName: speedtest-tls
  issuerRef: {name: letsencrypt-prod, kind: ClusterIssuer}
  dnsNames: [speedtest.owl.red]
  privateKey: {rotationPolicy: Always}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: {name: speedtest, namespace: speedtest}
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`speedtest.owl.red`)
      kind: Rule
      middlewares: [{name: administration-access}]
      services: [{name: speedtest, port: 80}]
  tls: {secretName: speedtest-tls}