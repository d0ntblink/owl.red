apiVersion: fleet.cattle.io/v1alpha1
kind: GitRepo
metadata:
  name: owl-red
  namespace: fleet-local
spec:
  repo: https://github.com/d0ntblink/owl.red.git
  branch: main
  clientSecretName: owl-red-github-auth
  paths:
    - gitops/technitium-ingress
    - gitops/metallb
    - gitops/cert-manager-controller
    - gitops/cert-manager
    - gitops/traefik
    - gitops/dashboards
    - gitops/bitwarden-operator
    - gitops/bitwarden-secrets
    - gitops/csi-smb
    - gitops/longhorn
    - gitops/longhorn-config
    - gitops/home-assistant
    - gitops/open-webui
    - gitops/flaresolverr
    - gitops/seerr
    - gitops/qbittorrent
    - gitops/pdm
    - gitops/platform-resilience
