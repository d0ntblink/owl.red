service:
  type: LoadBalancer
  annotations:
    metallb.io/loadBalancerIPs: "10.0.10.201"
  spec:
    externalTrafficPolicy: Local

deployment:
  replicas: 3

podDisruptionBudget:
  enabled: true
  minAvailable: 2

ingressClass:
  enabled: true
  isDefaultClass: true

providers:
  kubernetesCRD:
    enabled: true
  kubernetesIngress:
    enabled: true

logs:
  general:
    level: INFO

additionalArguments:
  - "--serversTransport.insecureSkipVerify=false"

ingressRoute:
  dashboard:
    enabled: true
    matchRule: Host(`traefik.owl.red`) && (PathPrefix(`/dashboard`) || PathPrefix(`/api`))
    entryPoints:
      - websecure
    middlewares:
      - name: traefik-dashboard-access
    tls:
      secretName: management-ingress-tls

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
              app.kubernetes.io/instance: traefik-traefik
          topologyKey: kubernetes.io/hostname

tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: traefik
        app.kubernetes.io/instance: traefik-traefik

ports:
  web:
    port: 8000
    expose:
      default: true
    exposedPort: 80
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    port: 8443
    expose:
      default: true
    exposedPort: 443
    http:
      tls:
        enabled: true

extraObjects:
  - apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: traefik-dashboard-access
      namespace: traefik
    spec:
      ipAllowList:
        sourceRange:
          - 10.0.10.0/24
          - 10.0.20.10/32
  - apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: traefik-dashboard-normalize
      namespace: traefik
    spec:
      redirectRegex:
        regex: "^https?://traefik\\.owl\\.red(?:$|/$|/dashboard$)"
        replacement: "https://traefik.owl.red/dashboard/"
        permanent: true
  - apiVersion: traefik.io/v1alpha1
    kind: IngressRoute
    metadata:
      name: traefik-dashboard-normalize
      namespace: traefik
    spec:
      entryPoints:
        - websecure
      routes:
        - match: Host(`traefik.owl.red`) && (Path(`/`) || Path(`/dashboard`))
          kind: Rule
          priority: 100
          middlewares:
            - name: traefik-dashboard-access
            - name: traefik-dashboard-normalize
          services:
            - kind: TraefikService
              name: api@internal
      tls:
        secretName: management-ingress-tls
  - apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata:
      name: management-ingress
      namespace: traefik
    spec:
      secretName: management-ingress-tls
      issuerRef:
        name: letsencrypt-prod
        kind: ClusterIssuer
      dnsNames:
        - traefik.owl.red
        - home.owl.red
        - pdm.owl.red
      privateKey:
        rotationPolicy: Always
  - apiVersion: traefik.io/v1alpha1
    kind: TLSStore
    metadata:
      name: default
      namespace: traefik
    spec:
      defaultCertificate:
        secretName: management-ingress-tls
