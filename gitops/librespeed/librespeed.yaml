apiVersion: v1
kind: PersistentVolume
metadata: {name: librespeed-config-nas}
spec:
  capacity: {storage: 2Gi}
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions: [vers=3.1.1, cache=strict, noserverino, uid=1001, gid=100, dir_mode=0770, file_mode=0660]
  claimRef: {namespace: librespeed, name: config}
  csi:
    driver: smb.csi.k8s.io
    volumeHandle: nas.owl.red/appdata#librespeed-v2#librespeed-config#retain
    volumeAttributes: {source: //nas.owl.red/appdata, subDir: librespeed-v2}
    nodeStageSecretRef: {name: unraid-smb-credentials, namespace: storage-system}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: config, namespace: librespeed}
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: librespeed-config-nas
  resources: {requests: {storage: 2Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: librespeed}
spec:
  ports: [{name: postgres, port: 5432, targetPort: 15432}]
---
apiVersion: v1
kind: Endpoints
metadata: {name: postgres, namespace: librespeed}
subsets:
  - addresses: [{ip: 10.0.10.5}]
    ports: [{name: postgres, port: 15432, protocol: TCP}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: librespeed, namespace: librespeed}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: librespeed}
  template:
    metadata:
      labels: {app.kubernetes.io/name: librespeed}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      tolerations:
        - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: librespeed
          image: linuxserver/librespeed@sha256:0f85aac620b60a2566049f95d085fd2b044c720abfe88d1f1e14496ea0496833
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [NET_RAW]}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          envFrom:
            - secretRef: {name: librespeed-runtime}
          env:
            - {name: PUID, value: "1001"}
            - {name: PGID, value: "100"}
            - {name: UMASK, value: "002"}
            - {name: TZ, value: America/Edmonton}
            - {name: DB_TYPE, value: postgresql}
            - {name: DB_HOSTNAME, value: postgres}
            - {name: DB_NAME, value: librespeed}
            - {name: DB_USERNAME, value: librespeed}
            - {name: CUSTOM_RESULTS, value: "true"}
          ports: [{name: http, containerPort: 80}]
          startupProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
          volumeMounts:
            - {name: config, mountPath: /config}
      volumes:
        - {name: config, persistentVolumeClaim: {claimName: config}}
---
apiVersion: v1
kind: Service
metadata: {name: librespeed, namespace: librespeed}
spec:
  selector: {app.kubernetes.io/name: librespeed}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: administration-access, namespace: librespeed}
spec:
  ipAllowList:
    sourceRange: [10.0.10.0/24, 10.0.20.10/32]
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: {name: librespeed, namespace: librespeed}
spec:
  secretName: librespeed-tls
  issuerRef: {name: letsencrypt-prod, kind: ClusterIssuer}
  dnsNames: [librespeed.owl.red]
  privateKey: {rotationPolicy: Always}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: {name: librespeed, namespace: librespeed}
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`librespeed.owl.red`)
      kind: Rule
      middlewares: [{name: administration-access}]
      services: [{name: librespeed, port: 80}]
  tls: {secretName: librespeed-tls}