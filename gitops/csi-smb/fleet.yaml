defaultNamespace: storage-system
helm:
  releaseName: csi-smb
  chart: csi-driver-smb
  repo: https://raw.githubusercontent.com/kubernetes-csi/csi-driver-smb/master/charts
  version: 1.20.3
  values:
    controller:
      replicas: 2
      runOnControlPlane: true
      logLevel: 2
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: csi-smb-controller
    node:
      logLevel: 2
    linux:
      kubelet: /var/lib/kubelet
    windows:
      enabled: false
    storageClasses:
      - name: nas-appdata-smb
        parameters:
          source: //nas.owl.red/appdata
          subDir: ${pvc.metadata.namespace}-${pvc.metadata.name}-${pv.metadata.name}
          onDelete: retain
          csi.storage.k8s.io/provisioner-secret-name: unraid-smb-credentials
          csi.storage.k8s.io/provisioner-secret-namespace: storage-system
          csi.storage.k8s.io/node-stage-secret-name: unraid-smb-credentials
          csi.storage.k8s.io/node-stage-secret-namespace: storage-system
        reclaimPolicy: Retain
        volumeBindingMode: Immediate
        allowVolumeExpansion: false
        mountOptions:
          - vers=3.1.1
          - cache=strict
          - noserverino
          - uid=1001
          - gid=100
          - dir_mode=0770
          - file_mode=0660