apiVersion: v1
kind: PersistentVolume
metadata:
  name: seerr-config-nas
spec:
  capacity: {storage: 2Gi}
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions: [vers=3.1.1, cache=strict, noserverino, uid=1001, gid=100, dir_mode=0770, file_mode=0660]
  claimRef: {namespace: seerr, name: config}
  csi:
    driver: smb.csi.k8s.io
    volumeHandle: nas.owl.red/appdata#seerr#seerr-config-nas#retain
    volumeAttributes:
      source: //nas.owl.red/appdata
      subDir: seerr
    nodeStageSecretRef:
      name: unraid-smb-credentials
      namespace: storage-system
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: config
  namespace: seerr
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: seerr-config-nas
  resources:
    requests: {storage: 2Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seerr
  namespace: seerr
spec:
  replicas: 0
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: seerr}
  template:
    metadata:
      labels: {app.kubernetes.io/name: seerr}
    spec:
      automountServiceAccountToken: false
      tolerations:
        - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 100
        fsGroup: 100
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: seerr
          image: ghcr.io/seerr-team/seerr@sha256:27602401178d54f1964442287b9f23f67a3fa2252645ee8065839ea1c3f69e45
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {cpu: "1", memory: 1Gi}
          envFrom:
            - secretRef: {name: seerr-database}
          env:
            - {name: CONFIG_DIRECTORY, value: /app/config}
            - {name: PORT, value: "5055"}
            - {name: DB_TYPE, value: postgres}
            - {name: DB_HOST, value: nas.owl.red}
            - {name: DB_PORT, value: "15432"}
            - {name: DB_USER, value: seerr}
            - {name: DB_NAME, value: seerr}
            - {name: DB_POOL_SIZE, value: "2"}
            - {name: DB_CONNECT_TIMEOUT_MS, value: "30000"}
            - {name: DB_LOG_QUERIES, value: "false"}
            - {name: LOG_LEVEL, value: info}
            - {name: TZ, value: UTC}
          ports:
            - {name: http, containerPort: 5055}
          startupProbe:
            httpGet: {path: /api/v1/status, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /api/v1/status, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/v1/status, port: http}
            periodSeconds: 30
          volumeMounts:
            - {name: config, mountPath: /app/config}
      volumes:
        - name: config
          persistentVolumeClaim: {claimName: config}
---
apiVersion: v1
kind: Service
metadata:
  name: seerr
  namespace: seerr
spec:
  selector: {app.kubernetes.io/name: seerr}
  ports:
    - {name: http, port: 5055, targetPort: http}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: administration-access
  namespace: seerr
spec:
  ipAllowList:
    sourceRange: [10.0.10.0/24, 10.0.20.10/32]
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: seerr
  namespace: seerr
spec:
  secretName: seerr-tls
  issuerRef: {name: letsencrypt-prod, kind: ClusterIssuer}
  dnsNames: [seerr.owl.red]
  privateKey: {rotationPolicy: Always}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: seerr
  namespace: seerr
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`seerr.owl.red`)
      kind: Rule
      middlewares:
        - name: administration-access
      services:
        - {name: seerr, port: 5055}
  tls:
    secretName: seerr-tls