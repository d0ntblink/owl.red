name: security

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege default token.
permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so historical commits are scanned too
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # .gitleaks.toml in the repo root is auto-detected.
          # GITLEAKS_LICENSE is only required for repos owned by a GitHub *organization*.

  bitwarden-placeholders:
    name: BitwardenSecret placeholder guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reject placeholder/invalid bwSecretId (see docs/issues/007)
        run: bash scripts/check-bitwarden-placeholders.sh

  technitium-sync:
    name: Technitium DHCP lifecycle guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check sync script syntax
        run: bash -n nix/hosts/technitium/sync.sh nix/hosts/technitium/sync.test.sh
      - name: Exercise offline DHCP lifecycle reconciliation
        run: bash nix/hosts/technitium/sync.test.sh
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: Exercise offline packet-capture coordination
        run: node --test scripts/capture-dhcp-authority.test.mjs

  vyos-config:
    name: VyOS renderer (Python ${{ matrix.python }}, Ansible ${{ matrix.ansible }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.12"
            ansible: "2.16.3"
          - python: "3.15"
            ansible: "2.22.0"
    env:
      ANSIBLE_PLAYBOOK: ansible-playbook
      PYTHON: python3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install the tested controller version for rendering
        run: python -m pip install 'ansible-core==${{ matrix.ansible }}'
      - name: Exercise current rendering and unsafe-input guards
        run: node --test scripts/vyos-config.test.mjs

  renovate-config:
    name: Renovate configuration
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: Validate repository update policy
        run: npx --yes --package renovate@44.209.0 renovate-config-validator --strict --no-global renovate.json
