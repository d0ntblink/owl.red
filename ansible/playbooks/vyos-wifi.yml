---
- name: Stage only the declared off-AP Wi-Fi gateway services
  hosts: "{{ wifi_gateway_target | default('edge_lab') }}"
  gather_facts: false
  vars_files:
    - ../vars/wifi-networks.yml
    - ../../vyos/baseline.yml
  vars:
    wifi_apply_allowed: false
    wifi_gateway_phase: trial
    wifi_gateway_scope: wifi
    wifi_dhcp_authority: "{{ 'vyos' if inventory_hostname == 'edge_lab' else vyos_production_baseline.dhcp_authority }}"
    wifi_ipv6_delegate: "{{ inventory_hostname == 'edge_router' }}"
    wifi_ipv6_plan: "{{ lookup('file', playbook_dir ~ '/../../gitops/technitium/network.json') | from_json }}"
    wifi_target_registry: "{{ lookup('file', playbook_dir ~ '/../../gitops/technitium/dhcp-reservations.json') | from_json }}"
    wifi_gateway_commands: "{{ lookup('template', playbook_dir ~ '/../templates/' ~ {'wifi': 'vyos-wifi-services.j2', 'ipv6': 'vyos-vlan-ipv6.j2', 'handoff': 'vyos-dhcp-handoff.j2'}[wifi_gateway_scope]) }}"
  tasks:
    - name: Require explicit gateway scope and the accepted AP allocation
      ansible.builtin.assert:
        that:
          - wifi_apply_allowed | bool
          - inventory_hostname in ['edge_lab', 'edge_router']
          - (inventory_hostname == 'edge_lab' and vm_id | int == 102) or (inventory_hostname == 'edge_router' and vm_id | int == 103)
          - wifi_gateway_phase in ['trial', 'confirm']
          - wifi_gateway_scope in ['wifi', 'ipv6', 'handoff']
          - wifi_networks.guest.gateway_owner == 'opennds'
          - wifi_networks.private.vlan | int == 20
          - wifi_networks.iot_local.vlan | int == 40
          - wifi_networks.iot_cloud.vlan | int == 50

    - name: Refuse collisions with non-owned gateway nodes
      ansible.builtin.raw: |
        /bin/vbash -c '
        [[ $(hostname) == {{ 'edge-lab' if inventory_hostname == 'edge_lab' else 'edge' }} ]] || builtin exit 1
        /bin/cli-shell-api existsActive interfaces ethernet eth1 vif 20 || builtin exit 1
        /bin/cli-shell-api existsActive firewall group network-group OWL_VLAN20_NONPUBLIC || builtin exit 1
        if /bin/cli-shell-api existsActive firewall ipv4 forward filter rule 2810; then
          [[ $(/bin/cli-shell-api returnActiveValue firewall ipv4 forward filter rule 2810 description) == OWL-WIFI-PRIVATE-INGRESS ]] || builtin exit 1
        fi
        {% for name, network in wifi_networks.items() if network.enabled and (network.gateway_owner | default('vyos')) == 'vyos' %}
        {% if network.vlan != 20 %}
        if /bin/cli-shell-api existsActive interfaces ethernet eth1 vif {{ network.vlan }}; then
          [[ $(/bin/cli-shell-api returnActiveValue interfaces ethernet eth1 vif {{ network.vlan }} description) == OWL-WIFI-{{ network.vlan }} ]] || builtin exit 1
        fi
        {% endif %}
        if /bin/cli-shell-api existsActive service dhcp-server shared-network-name WIFI_{{ name | upper }}; then
          [[ $(/bin/cli-shell-api returnActiveValue service dhcp-server shared-network-name WIFI_{{ name | upper }} description) == OWL-WIFI-{{ network.vlan }} ]] || builtin exit 1
        fi
        {% endfor %}
        '
      changed_when: false

    - name: Retain the actual gateway boot configuration privately
      ansible.builtin.raw: sudo -n cat /config/config.boot
      register: wifi_gateway_before
      changed_when: false
      no_log: true
      when: wifi_gateway_phase == 'trial'

    - name: Refuse collisions in the dual-stack VLAN ownership slice
      ansible.builtin.raw: |
        /bin/vbash -c '
        {% for family, number, marker in [('ipv4', 90, 'OWL-VLAN-CLIENT-DNS-EGRESS'), ('ipv6', 90, 'OWL-VLAN-CLIENT-DNS-EGRESS'), ('ipv4', 110, 'OWL-VLAN-NATIVE-ADMIN'), ('ipv6', 110, 'OWL-VLAN-NATIVE-ADMIN'), ('ipv4', 6300, 'OWL-VLAN-GUEST-QUARANTINE'), ('ipv4', 2820, 'OWL-VLAN-PRIVATE-LOCAL-IOT'), ('ipv4', 2830, 'OWL-VLAN-CLOUD-MEDIA')] %}
        if /bin/cli-shell-api existsActive firewall {{ family }} forward filter rule {{ number }}; then
          [[ $(/bin/cli-shell-api returnActiveValue firewall {{ family }} forward filter rule {{ number }} description) == {{ marker }} ]] || builtin exit 1
        fi
        {% endfor %}
        {% for network in wifi_ipv6_plan.vlans if network.id != 10 %}
        if /bin/cli-shell-api existsActive firewall ipv6 forward filter rule {{ 6000 + network.id * 10 }}; then
          [[ $(/bin/cli-shell-api returnActiveValue firewall ipv6 forward filter rule {{ 6000 + network.id * 10 }} description) == OWL-VLAN-IPV6-{{ network.id }} ]] || builtin exit 1
        fi
        {% endfor %}
        '
      changed_when: false
      when: wifi_gateway_scope == 'ipv6'

    - name: Preserve the private gateway recovery preimage
      ansible.builtin.copy:
        content: "{{ wifi_gateway_before.stdout }}"
        dest: "{{ wifi_recovery_directory }}/{{ inventory_hostname }}-before.config.boot"
        mode: "0600"
      delegate_to: localhost
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      no_log: true
      when: wifi_gateway_phase == 'trial'

    - name: Stage and trial the declared services under native timed rollback
      ansible.builtin.raw: |
        /bin/vbash -c '
        source /opt/vyatta/etc/functions/script-template
        configure
        if /bin/cli-shell-api sessionChanged; then builtin exit 1; fi
        {% if inventory_hostname == 'edge_lab' %}
        confirm >/dev/null 2>&1 || true
        {% endif %}
        owl_command_output=$(
        {{ wifi_gateway_commands }}
        ) || builtin exit 1
        printf "%s\n" "$owl_command_output"
        if [[ "$owl_command_output" == *"Set failed"* || "$owl_command_output" == *"Delete failed"* ]]; then
          discard
          builtin exit 1
        fi
        if /bin/cli-shell-api sessionChanged; then
          commit-confirm 10 no-prompt || builtin exit 1
          if /bin/cli-shell-api sessionChanged; then builtin exit 1; fi
          printf "OWL_WIFI_GATEWAY_TRIAL\n"
        else
          printf "OWL_WIFI_GATEWAY_UNCHANGED\n"
        fi
        exit
        '
      register: wifi_gateway_trial
      changed_when: "'OWL_WIFI_GATEWAY_TRIAL' in wifi_gateway_trial.stdout"
      failed_when: >-
        wifi_gateway_trial.rc != 0 or 'Set failed' in wifi_gateway_trial.stdout or
        'Commit failed' in wifi_gateway_trial.stdout or 'OWL_WIFI_GATEWAY_' not in wifi_gateway_trial.stdout
      when: wifi_gateway_phase == 'trial'

    - name: Confirm gateway services only after their acceptance
      ansible.builtin.raw: |
        /bin/vbash -c '
        source /opt/vyatta/etc/functions/script-template
        configure
        confirm || builtin exit 1
        save /config/config.boot || builtin exit 1
        exit
        '
      when: wifi_gateway_phase == 'confirm'

    - name: Verify actual native services and new gateway addresses
      ansible.builtin.raw: |
        ip -j -4 address show dev eth1.40 &&
        ip -j -4 address show dev eth1.50 &&
        systemctl is-active pdns-recursor.service chrony.service &&
        {% if wifi_gateway_scope == 'handoff' or wifi_dhcp_authority == 'technitium' %}
        ! systemctl is-active --quiet isc-kea-dhcp4-server.service
        {% else %}
        systemctl is-active isc-kea-dhcp4-server.service
        {% endif %}
      register: wifi_gateway_runtime
      changed_when: false
      failed_when: >-
        wifi_gateway_runtime.rc != 0 or
        '10.0.40.1' not in wifi_gateway_runtime.stdout or
        '10.0.50.1' not in wifi_gateway_runtime.stdout