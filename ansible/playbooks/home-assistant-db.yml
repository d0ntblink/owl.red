---
- name: Manage the dedicated Home Assistant recorder
  hosts: nas_unraid
  gather_facts: false
  any_errors_fatal: true
  vars:
    homeassistant_db_name: home-assistant-postgres
    homeassistant_db_path: /mnt/ssd/appdata/home-assistant-db
    homeassistant_docker_host: "{{ lookup('ansible.builtin.env', 'HOMEASSISTANT_DOCKER_HOST') }}"
    homeassistant_db_admin_password: "{{ lookup('ansible.builtin.env', 'HOMEASSISTANT_DB_ADMIN_PASSWORD') }}"
    homeassistant_db_password: "{{ lookup('ansible.builtin.env', 'HOMEASSISTANT_DB_PASSWORD') }}"
    homeassistant_postgres_image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
  pre_tasks:
    - name: Require the approved host, private socket and explicit apply
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'nas_unraid'
          - ansible_host == '10.0.10.5'
          - homeassistant_db_apply | default(false) | bool
          - homeassistant_docker_host is match('^unix:///')
          - homeassistant_db_admin_password is match('^[a-f0-9]{64}$')
          - homeassistant_db_password is match('^[a-f0-9]{64}$')
      no_log: true

    - name: Inspect only the intended database container
      community.docker.docker_container_info:
        docker_host: "{{ homeassistant_docker_host }}"
        name: "{{ homeassistant_db_name }}"
      delegate_to: localhost
      become: false
      register: homeassistant_db_existing
      no_log: true

    - name: Reject an existing container not owned by this lane
      ansible.builtin.assert:
        that:
          - >-
            not homeassistant_db_existing.exists or
            homeassistant_db_existing.container.Config.Labels.get('owl.red.component', '') == 'home-assistant-recorder'
      no_log: true

  tasks:
    - name: Create only the isolated recorder directory or verify its marker
      ansible.builtin.raw: |
        set -eu
        base={{ homeassistant_db_path | quote }}
        if test -e "$base"; then
          test -d "$base" && ! test -L "$base"
          test -f "$base/.owl-red-recorder"
          test "$(cat "$base/.owl-red-recorder")" = 'home-assistant-recorder'
          test -d "$base/data" && ! test -L "$base/data"
          printf 'existing\n'
        else
          test -d /mnt/ssd/appdata
          mkdir -m 0700 "$base"
          printf 'home-assistant-recorder\n' > "$base/.owl-red-recorder"
          chmod 0600 "$base/.owl-red-recorder"
          mkdir -m 0700 "$base/data"
          printf 'created\n'
        fi
      register: homeassistant_db_directory
      changed_when: "'created' in homeassistant_db_directory.stdout"

    - name: Run the dedicated PostgreSQL server with retained local data
      community.docker.docker_container:
        docker_host: "{{ homeassistant_docker_host }}"
        name: "{{ homeassistant_db_name }}"
        image: "{{ homeassistant_postgres_image }}"
        state: started
        restart_policy: unless-stopped
        stop_timeout: 60
        memory: 768m
        shm_size: 256m
        labels:
          owl.red.component: home-assistant-recorder
        published_ports:
          - 10.0.10.5:15432:5432
        mounts:
          - type: bind
            source: "{{ homeassistant_db_path }}/data"
            target: /var/lib/postgresql/data
        env:
          POSTGRES_PASSWORD: "{{ homeassistant_db_admin_password }}"
          POSTGRES_DB: postgres
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
        command:
          - postgres
          - -c
          - shared_buffers=128MB
          - -c
          - max_connections=30
        security_opts:
          - no-new-privileges:true
        healthcheck:
          test: [CMD-SHELL, 'pg_isready -U postgres -d postgres']
          interval: 10s
          timeout: 5s
          retries: 6
          start_period: 30s
      delegate_to: localhost
      become: false
      no_log: true

    - name: Wait for only this database server to accept connections
      community.docker.docker_container_info:
        docker_host: "{{ homeassistant_docker_host }}"
        name: "{{ homeassistant_db_name }}"
      delegate_to: localhost
      become: false
      register: homeassistant_db_health
      until: homeassistant_db_health.container.State.Health.Status == 'healthy'
      retries: 12
      delay: 5
      no_log: true

    - name: Create the least-privilege application role
      community.postgresql.postgresql_user:
        login_host: 10.0.10.5
        login_port: 15432
        login_user: postgres
        login_password: "{{ homeassistant_db_admin_password }}"
        login_db: postgres
        name: homeassistant
        password: "{{ homeassistant_db_password }}"
        role_attr_flags: LOGIN,NOSUPERUSER,NOCREATEDB,NOCREATEROLE,NOREPLICATION
        state: present
      delegate_to: localhost
      become: false
      no_log: true

    - name: Create the application-owned UTF-8 database
      community.postgresql.postgresql_db:
        login_host: 10.0.10.5
        login_port: 15432
        login_user: postgres
        login_password: "{{ homeassistant_db_admin_password }}"
        name: homeassistant
        owner: homeassistant
        encoding: UTF8
        template: template0
        state: present
      delegate_to: localhost
      become: false
      no_log: true