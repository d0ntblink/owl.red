---
- name: Guard allowlisted PVE management-prefix changes
  hosts: edge_pve:storage_pve:cp1_pve:cp2_pve:cp3_pve:worker1_pve
  serial: 1
  any_errors_fatal: true
  gather_facts: false
  become: false
  vars:
    proxmox_prefix_pilot_targets:
      storage_pve:
        node: storage
        address: 10.0.10.4
        guest: ""
        api_address: ""
        bridge_ports: bond0
        interfaces: [lo, obnic0, obnic1, bond0, vmbr0]
        bond_interface: bond0
        bond_parameters:
          mode: active-backup 1
          slaves: obnic0 obnic1
          miimon: "100"
          primary: obnic0
          active_slave: obnic0
        protected_guests:
          - kind: qemu
            id: "101"
        dns_checks:
          - server: 10.0.10.30
            domain: rancher.owl.red
            expected_address: 10.0.10.201
        service_checks:
          - host: 10.0.10.5
            port: 443
          - host: 10.0.10.5
            port: 445
      edge_pve:
        node: edge
        address: 10.0.10.3
        guest: ""
        api_address: ""
        bridge_ports: onboard
        interfaces: [lo, onboard, vmbr0, nic0, nic1, nic2, nic3]
        protected_guests:
          - kind: qemu
            id: "100"
          - kind: lxc
            id: "200"
        dns_checks:
          - server: 10.0.10.1
            domain: example.com
            expected_address: ""
          - server: 10.0.10.30
            domain: rancher.owl.red
            expected_address: 10.0.10.201
        service_checks:
          - host: 10.0.10.1
            port: 443
          - host: 10.0.10.30
            port: 5380
      cp1_pve:
        node: cp1
        address: 10.0.10.11
        guest: cp1-talos
        api_address: 10.0.10.21
        bridge_ports: nic0
        interfaces: [lo, nic0, vmbr0]
        protected_guests: []
        dns_checks: []
        service_checks:
          - host: 10.0.10.31
            port: 8443
      cp2_pve:
        node: cp2
        address: 10.0.10.12
        guest: cp2-talos
        api_address: 10.0.10.22
        bridge_ports: nic0
        interfaces: [lo, nic0, vmbr0]
        protected_guests: []
        dns_checks: []
        service_checks: []
      cp3_pve:
        node: cp3
        address: 10.0.10.13
        guest: cp3-talos
        api_address: 10.0.10.23
        bridge_ports: nic0
        interfaces: [lo, nic0, vmbr0]
        protected_guests: []
        dns_checks: []
        service_checks: []
      worker1_pve:
        node: worker1
        address: 10.0.10.14
        guest: worker1-talos
        api_address: ""
        bridge_ports: nic0
        interfaces: [lo, nic0, vmbr0]
        protected_guests: []
        dns_checks: []
        service_checks: []
    proxmox_prefix_pilot_target: "{{ proxmox_prefix_pilot_targets[inventory_hostname] }}"
    proxmox_prefix_pilot_node: "{{ proxmox_prefix_pilot_target.node }}"
    proxmox_prefix_pilot_address: "{{ proxmox_prefix_pilot_target.address }}"
    proxmox_prefix_pilot_guest: "{{ proxmox_prefix_pilot_target.guest }}"
    proxmox_prefix_pilot_api_address: "{{ proxmox_prefix_pilot_target.api_address }}"
    proxmox_prefix_pilot_dns_probe: |
      const { Resolver } = require('node:dns').promises;
      const [server, domain, expected] = process.argv.slice(1);
      const resolver = new Resolver({ timeout: 2000, tries: 1 });
      resolver.setServers([server]);
      resolver.resolve4(domain).then(addresses => {
        if (!addresses.length || (expected && !addresses.includes(expected))) {
          throw new Error('Unexpected DNS result');
        }
        console.log('ok');
      }).catch(() => { console.error('Scoped DNS query failed'); process.exitCode = 1; });
    proxmox_prefix_pilot_interface: vmbr0
    proxmox_prefix_pilot_before: "{{ proxmox_prefix_pilot_address }}/16"
    proxmox_prefix_pilot_after: "{{ proxmox_prefix_pilot_address }}/24"
    proxmox_prefix_pilot_apply_confirmed: false
    proxmox_prefix_pilot_state_dir: ""
    proxmox_prefix_pilot_controller_dir: ""
    proxmox_prefix_pilot_unit: ""
    proxmox_prefix_pilot_rollback_seconds: 180
    proxmox_prefix_pilot_rollback_script: |
      #!/usr/bin/env bash
      set -euo pipefail
      state_dir=${1:?}
      config_path=${2:?}
      reload_command=${3:?}
      exec 9>"$state_dir/lock"
      flock -x 9
      if [[ -e "$state_dir/confirmed" ]]; then
        exit 0
      fi
      file_digest() {
        local digest
        digest=$(sha256sum -- "$1")
        printf '%s' "${digest%% *}"
      }
      read -r before_digest < "$state_dir/before.sha256"
      read -r staged_digest < "$state_dir/staged.sha256"
      if [[ "$(file_digest "$state_dir/interfaces.before")" != "$before_digest" ]]; then
        touch "$state_dir/rollback-blocked"
        exit 4
      fi
      current_digest=$(file_digest "$config_path")
      if [[ "$current_digest" != "$before_digest" && "$current_digest" != "$staged_digest" ]]; then
        touch "$state_dir/rollback-blocked"
        exit 2
      fi
      if [[ -e "$config_path.new" && "$(file_digest "$config_path.new")" != "$staged_digest" ]]; then
        touch "$state_dir/rollback-blocked"
        exit 3
      fi
      install -m 0644 -- "$state_dir/interfaces.before" "$config_path"
      if [[ -e "$config_path.new" ]]; then
        rm -- "$config_path.new"
      fi
      "$reload_command" -a
      touch "$state_dir/rolled-back"
    proxmox_prefix_pilot_confirm_script: |
      #!/usr/bin/env bash
      set -euo pipefail
      state_dir=${1:?}
      config_path=${2:?}
      timer_unit=${3:?}
      systemctl_command=${4:?}
      exec 9>"$state_dir/lock"
      flock -x 9
      [[ ! -e "$state_dir/rolled-back" && ! -e "$state_dir/rollback-blocked" ]]
      read -r staged_digest < "$state_dir/staged.sha256"
      current_digest=$(sha256sum -- "$config_path")
      [[ "${current_digest%% *}" == "$staged_digest" ]]
      install -m 0600 /dev/null "$state_dir/confirmed"
      "$systemctl_command" stop "$timer_unit.timer"
  tasks:
    - name: Require check mode or explicit approval of this one-host pilot
      ansible.builtin.assert:
        that:
          - ansible_check_mode or proxmox_prefix_pilot_apply_confirmed | bool
          - inventory_hostname in ['edge_pve', 'storage_pve', 'cp1_pve', 'cp2_pve', 'cp3_pve', 'worker1_pve']
          - ansible_play_hosts_all | length == 1
          - ansible_host == proxmox_prefix_pilot_target.address
          - proxmox_prefix_pilot_address == proxmox_prefix_pilot_target.address
          - proxmox_prefix_pilot_node == proxmox_prefix_pilot_target.node
          - proxmox_prefix_pilot_guest == proxmox_prefix_pilot_target.guest
          - proxmox_prefix_pilot_api_address == proxmox_prefix_pilot_target.api_address
          - proxmox_prefix_pilot_interface == 'vmbr0'
          - proxmox_prefix_pilot_before == ansible_host ~ '/16'
          - proxmox_prefix_pilot_after == ansible_host ~ '/24'
          - proxmox_prefix_pilot_rollback_seconds | int == 180
        fail_msg: Select exactly one allowlisted PVE management host; NAS is not a target and every live prefix change needs explicit approval.
        quiet: true

    - name: Read the owning PVE interface configuration
      ansible.builtin.command:
        argv:
          - pvesh
          - get
          - "/nodes/{{ proxmox_prefix_pilot_node }}/network/{{ proxmox_prefix_pilot_interface }}"
          - --output-format
          - json
      register: _prefix_pve
      changed_when: false
      check_mode: false

    - name: Read the runtime management address
      ansible.builtin.command:
        argv: [ip, -j, address, show, dev, vmbr0]
      register: _prefix_runtime
      changed_when: false
      check_mode: false

    - name: Check for a pre-existing pending network change
      ansible.builtin.stat:
        path: /etc/network/interfaces.new
      register: _prefix_pending

    - name: Inventory included interface files
      ansible.builtin.find:
        paths: /etc/network/interfaces.d
        file_type: any
        hidden: true
      register: _prefix_includes

    - name: Read configured SDN zones without changing the cluster
      ansible.builtin.command:
        argv: [pvesh, get, /cluster/sdn/zones, --output-format, json]
      register: _prefix_sdn
      changed_when: false
      check_mode: false

    - name: Read cluster membership and quorum
      ansible.builtin.command:
        argv: [pvesh, get, /cluster/status, --output-format, json]
      register: _prefix_cluster
      changed_when: false
      check_mode: false

    - name: Capture the exact current interface source without displaying it
      ansible.builtin.slurp:
        src: /etc/network/interfaces
      register: _prefix_source
      no_log: true

    - name: Read source ownership and permissions
      ansible.builtin.stat:
        path: /etc/network/interfaces
        follow: false
      register: _prefix_source_metadata

    - name: Refuse unexpected topology or another operator's pending changes
      ansible.builtin.assert:
        that:
          - not _prefix_pending.stat.exists
          - _prefix_source_metadata.stat.isreg
          - not _prefix_source_metadata.stat.islnk
          - _prefix_source_metadata.stat.uid == 0
          - _prefix_source_metadata.stat.gid == 0
          - _prefix_source_metadata.stat.mode == '0644'
          - >-
            _prefix_includes.matched == 0 or
            (_prefix_includes.matched == 1 and
             _prefix_includes.files[0]['path'] == '/etc/network/interfaces.d/sdn' and
             _prefix_includes.files[0]['size'] == 0 and
             _prefix_includes.files[0]['isreg'] and
             not _prefix_includes.files[0]['islnk'])
          - (_prefix_sdn.stdout | from_json) | length == 0
          - (_prefix_pve.stdout | from_json)['cidr'] in [proxmox_prefix_pilot_before, proxmox_prefix_pilot_after]
          - (_prefix_pve.stdout | from_json)['type'] == 'bridge'
          - (_prefix_pve.stdout | from_json)['bridge_ports'] == proxmox_prefix_pilot_target.bridge_ports
          - (_prefix_pve.stdout | from_json)['gateway'] == '10.0.10.1'
          - (_prefix_runtime.stdout | from_json)[0]['addr_info'] | selectattr('family', 'equalto', 'inet') | list | length == 1
          - (_prefix_runtime.stdout | from_json)[0]['addr_info'] | selectattr('local', 'equalto', proxmox_prefix_pilot_address) | map(attribute='prefixlen') | first | int == (_prefix_pve.stdout | from_json)['netmask'] | int
          - (_prefix_cluster.stdout | from_json) | selectattr('type', 'equalto', 'node') | selectattr('online', 'equalto', 1) | list | length == 6
          - (_prefix_cluster.stdout | from_json) | selectattr('type', 'equalto', 'cluster') | selectattr('quorate', 'equalto', 1) | list | length == 1
        fail_msg: Pilot baseline differs or a pending change already exists; nothing will be staged or activated.
        quiet: true

    - name: Verify the existing gateway responds before a change
      ansible.builtin.command:
        argv: [ping, -n, -c, "1", -W, "2", 10.0.10.1]
      changed_when: false
      check_mode: false

    - name: Read storage bond runtime parameters without changing them
      ansible.builtin.slurp:
        src: "/sys/class/net/{{ proxmox_prefix_pilot_target.bond_interface }}/bonding/{{ item }}"
      loop: "{{ (proxmox_prefix_pilot_target.bond_parameters | default({})).keys() | list }}"
      register: _prefix_bond_before
      no_log: true

    - name: Require the reviewed storage bond baseline
      ansible.builtin.assert:
        that:
          - (item.content | b64decode | trim) == proxmox_prefix_pilot_target.bond_parameters[item.item]
        quiet: true
      loop: "{{ _prefix_bond_before.results }}"
      no_log: true

    - name: Read NAS interface identity without changing guest settings
      ansible.builtin.command:
        argv: [ip, -j, address, show, dev, eth0]
      delegate_to: nas_unraid
      register: _prefix_nas_before
      changed_when: false
      check_mode: false
      no_log: true
      when: proxmox_prefix_pilot_node == 'storage'

    - name: Require the expected NAS identity before changing its PVE host
      ansible.builtin.assert:
        that:
          - (_prefix_nas_before.stdout | from_json)[0]['ifname'] == 'eth0'
          - (_prefix_nas_before.stdout | from_json)[0]['address'] == 'f8:f2:1e:48:91:40'
          - (_prefix_nas_before.stdout | from_json)[0]['addr_info'] | selectattr('family', 'equalto', 'inet') | list | length == 1
          - (_prefix_nas_before.stdout | from_json)[0]['addr_info'] | selectattr('local', 'equalto', '10.0.10.5') | selectattr('prefixlen', 'equalto', 16) | list | length == 1
        quiet: true
      when: proxmox_prefix_pilot_node == 'storage'

    - name: Verify the selected compute guest is Ready
      ansible.builtin.command:
        argv: [kubectl, get, node, "{{ proxmox_prefix_pilot_guest }}", -o, json]
      delegate_to: localhost
      register: _prefix_guest_before
      changed_when: false
      check_mode: false
      when: proxmox_prefix_pilot_guest | length > 0

    - name: Refuse an already unhealthy compute guest
      ansible.builtin.assert:
        that:
          - (_prefix_guest_before.stdout | from_json)['status']['conditions'] | selectattr('type', 'equalto', 'Ready') | selectattr('status', 'equalto', 'True') | list | length == 1
        quiet: true
      when: proxmox_prefix_pilot_guest | length > 0

    - name: Read protected guest configurations before changing the host
      ansible.builtin.command:
        argv: [pvesh, get, "/nodes/{{ proxmox_prefix_pilot_node }}/{{ item.kind }}/{{ item.id }}/config", --output-format, json]
      loop: "{{ proxmox_prefix_pilot_target.protected_guests }}"
      register: _prefix_protected_config_before
      changed_when: false
      check_mode: false
      no_log: true

    - name: Read protected guest running state before changing the host
      ansible.builtin.command:
        argv: [pvesh, get, "/nodes/{{ proxmox_prefix_pilot_node }}/{{ item.kind }}/{{ item.id }}/status/current", --output-format, json]
      loop: "{{ proxmox_prefix_pilot_target.protected_guests }}"
      register: _prefix_protected_status_before
      changed_when: false
      check_mode: false
      no_log: true

    - name: Refuse an already stopped protected guest
      ansible.builtin.assert:
        that:
          - (item.stdout | from_json)['status'] == 'running'
          - item.item.kind != 'qemu' or ((item.stdout | from_json)['pid'] | default(0) | int) > 0
        quiet: true
      loop: "{{ _prefix_protected_status_before.results }}"
      no_log: true

    - name: Read the existing Technitium daemon identity on edge
      ansible.builtin.command:
        argv: [pct, exec, "200", --, /run/current-system/sw/bin/systemctl, show, technitium-dns-server.service, --property=MainPID, --value]
      register: _prefix_dns_pid_before
      changed_when: false
      check_mode: false
      when: proxmox_prefix_pilot_node == 'edge'

    - name: Require a running Technitium daemon before changing edge
      ansible.builtin.assert:
        that:
          - _prefix_dns_pid_before.stdout | trim | int > 0
        quiet: true
      when: proxmox_prefix_pilot_node == 'edge'

    - name: Verify existing scoped DNS behavior before changing the host
      ansible.builtin.command:
        argv: [node, -e, "{{ proxmox_prefix_pilot_dns_probe }}", "{{ item.server }}", "{{ item.domain }}", "{{ item.expected_address }}"]
      loop: "{{ proxmox_prefix_pilot_target.dns_checks }}"
      delegate_to: localhost
      changed_when: false
      check_mode: false

    - name: Verify the selected control-plane API before a host change
      ansible.builtin.command:
        argv: [kubectl, "--server=https://{{ proxmox_prefix_pilot_api_address }}:6443", --request-timeout=10s, get, --raw=/readyz]
      delegate_to: localhost
      register: _prefix_api_before
      changed_when: false
      check_mode: false
      failed_when: _prefix_api_before.rc != 0 or (_prefix_api_before.stdout | trim) != 'ok'
      when: proxmox_prefix_pilot_api_address | length > 0

    - name: Verify service ports attached to the selected compute host
      ansible.builtin.wait_for:
        host: "{{ item.host }}"
        port: "{{ item.port }}"
        connect_timeout: 2
        timeout: 5
        state: started
      delegate_to: localhost
      loop: "{{ proxmox_prefix_pilot_target.service_checks }}"
      check_mode: false

    - name: Report the one-host prefix-only proposal
      ansible.builtin.debug:
        msg:
          node: "{{ proxmox_prefix_pilot_node }}"
          interface: "{{ proxmox_prefix_pilot_interface }}"
          before: "{{ (_prefix_pve.stdout | from_json)['cidr'] }}"
          proposed: "{{ proxmox_prefix_pilot_after }}"
          unchanged: IP address, gateway, DNS, physical NIC, bridge membership and VLAN tagging
          live_activation_requires_explicit_opt_in: true
          host_local_rollback_seconds: "{{ proxmox_prefix_pilot_rollback_seconds }}"

    - name: Stage and activate only the explicitly approved host prefix change
      when:
        - not ansible_check_mode
        - (_prefix_pve.stdout | from_json)['cidr'] != proxmox_prefix_pilot_after
      block:
        - name: Require unique private recovery destinations and a timer name
          ansible.builtin.assert:
            that:
              - proxmox_prefix_pilot_state_dir is match('^/var/lib/owl-red/prefix-pilot/[A-Za-z0-9_-]+$')
              - proxmox_prefix_pilot_controller_dir.startswith('/')
              - proxmox_prefix_pilot_controller_dir | length > 10
              - proxmox_prefix_pilot_unit is match('^owl-prefix-' ~ proxmox_prefix_pilot_node ~ '-[A-Za-z0-9_-]+$')
              - (_prefix_source.content | b64decode) | regex_findall(proxmox_prefix_pilot_before | regex_escape) | length == 1
              - proxmox_prefix_pilot_after not in (_prefix_source.content | b64decode)
            quiet: true

        - name: Refuse a pre-existing host recovery directory
          ansible.builtin.stat:
            path: "{{ proxmox_prefix_pilot_state_dir }}"
          register: _prefix_existing_state

        - name: Require a fresh run identity
          ansible.builtin.assert:
            that:
              - not _prefix_existing_state.stat.exists
            quiet: true

        - name: Check that controller recovery evidence will not be overwritten
          ansible.builtin.stat:
            path: "{{ proxmox_prefix_pilot_controller_dir }}"
          delegate_to: localhost
          register: _prefix_existing_controller_state

        - name: Require a new controller recovery directory
          ansible.builtin.assert:
            that:
              - not _prefix_existing_controller_state.stat.exists
            quiet: true

        - name: Create the private host recovery directory
          ansible.builtin.file:
            path: "{{ proxmox_prefix_pilot_state_dir }}"
            state: directory
            owner: root
            group: root
            mode: "0700"

        - name: Save the exact current source on the host
          ansible.builtin.copy:
            dest: "{{ proxmox_prefix_pilot_state_dir }}/interfaces.before"
            content: "{{ _prefix_source.content | b64decode }}"
            owner: root
            group: root
            mode: "0600"
          no_log: true

        - name: Create the private controller recovery directory
          ansible.builtin.file:
            path: "{{ proxmox_prefix_pilot_controller_dir }}"
            state: directory
            mode: "0700"
          delegate_to: localhost

        - name: Retain the source outside the affected host
          ansible.builtin.copy:
            dest: "{{ proxmox_prefix_pilot_controller_dir }}/interfaces.before"
            content: "{{ _prefix_source.content | b64decode }}"
            mode: "0600"
          delegate_to: localhost
          no_log: true

        - name: Stage only the management CIDR through the PVE API
          ansible.builtin.command:
            argv: [pvesh, set, "/nodes/{{ proxmox_prefix_pilot_node }}/network/vmbr0", --type, bridge, --cidr, "{{ proxmox_prefix_pilot_after }}"]
          changed_when: true
          when: proxmox_prefix_pilot_node != 'storage'

        - name: Recheck the storage source immediately before exact staging
          ansible.builtin.slurp:
            src: /etc/network/interfaces
          register: _prefix_storage_source
          no_log: true
          when: proxmox_prefix_pilot_node == 'storage'

        - name: Refuse storage source drift since its recovery preimage
          ansible.builtin.assert:
            that:
              - _prefix_storage_source.content == _prefix_source.content
            quiet: true
          when: proxmox_prefix_pilot_node == 'storage'

        - name: Stage the exact storage preimage with only its CIDR replaced
          ansible.builtin.copy:
            dest: /etc/network/interfaces.new
            content: "{{ (_prefix_source.content | b64decode) | replace(proxmox_prefix_pilot_before, proxmox_prefix_pilot_after) }}"
            owner: root
            group: root
            mode: "0644"
            force: false
          register: _prefix_storage_stage
          no_log: true
          when: proxmox_prefix_pilot_node == 'storage'

        - name: Require storage staging to create its own new pending file
          ansible.builtin.assert:
            that:
              - _prefix_storage_stage.changed
            quiet: true
          when: proxmox_prefix_pilot_node == 'storage'

        - name: Read the staged file without displaying it
          ansible.builtin.slurp:
            src: /etc/network/interfaces.new
          register: _prefix_staged
          no_log: true

        - name: Refuse any staged directive change beyond CIDR and formatting
          ansible.builtin.assert:
            that:
              - >-
                ((_prefix_staged.content | b64decode).splitlines()
                 | map('trim') | reject('match', '^#') | reject('equalto', '') | sort | list)
                ==
                (((_prefix_source.content | b64decode)
                  | replace(proxmox_prefix_pilot_before, proxmox_prefix_pilot_after)).splitlines()
                 | map('trim') | reject('match', '^#') | reject('equalto', '') | sort | list)
            fail_msg: Staged directives differ beyond the reviewed CIDR; activation is refused.
            quiet: true

        - name: Parse all original interfaces including the manual physical NIC
          ansible.builtin.command:
            argv: "{{ ['ifquery', '-i', proxmox_prefix_pilot_state_dir ~ '/interfaces.before', '-o', 'json'] + proxmox_prefix_pilot_target.interfaces }}"
          register: _prefix_original_parsed
          changed_when: false

        - name: Parse all staged interfaces without applying them
          ansible.builtin.command:
            argv: "{{ ['ifquery', '-i', '/etc/network/interfaces.new', '-o', 'json'] + proxmox_prefix_pilot_target.interfaces }}"
          register: _prefix_staged_parsed
          changed_when: false

        - name: Capture the original parsed bridge
          ansible.builtin.set_fact:
            _prefix_original_bridge: "{{ (_prefix_original_parsed.stdout | from_json) | selectattr('name', 'equalto', 'vmbr0') | first }}"

        - name: Require the reviewed parsed interface set
          ansible.builtin.assert:
            that:
              - ((_prefix_original_parsed.stdout | from_json) | map(attribute='name') | sort) == (proxmox_prefix_pilot_target.interfaces | sort)
              - _prefix_original_bridge['config']['address'] == proxmox_prefix_pilot_before
            quiet: true

        - name: Build the one-field expected interface model
          ansible.builtin.set_fact:
            _prefix_expected_interfaces: >-
              {{ ((_prefix_original_parsed.stdout | from_json)
                   | rejectattr('name', 'equalto', 'vmbr0') | list)
                 + [(_prefix_original_bridge | combine({'config':
                      (_prefix_original_bridge['config']
                       | combine({'address': proxmox_prefix_pilot_after}))}))] }}

        - name: Refuse any other parsed interface change before activation
          ansible.builtin.assert:
            that:
              - ((_prefix_staged_parsed.stdout | from_json) | sort(attribute='name')) == (_prefix_expected_interfaces | sort(attribute='name'))
            fail_msg: Parsed staged network differs beyond the management address prefix; activation is refused.
            quiet: true

        - name: Save expected file digests for guarded local recovery
          ansible.builtin.copy:
            dest: "{{ proxmox_prefix_pilot_state_dir }}/{{ item.name }}.sha256"
            content: "{{ item.content }}\n"
            mode: "0600"
          loop:
            - name: before
              content: "{{ (_prefix_source.content | b64decode) | hash('sha256') }}"
            - name: staged
              content: "{{ (_prefix_staged.content | b64decode) | hash('sha256') }}"

        - name: Install the syntax-checked local rollback program
          ansible.builtin.copy:
            dest: "{{ proxmox_prefix_pilot_state_dir }}/rollback.sh"
            content: "{{ proxmox_prefix_pilot_rollback_script }}"
            mode: "0700"
            validate: /bin/bash -n %s

        - name: Arm recovery before activating any network change
          ansible.builtin.command:
            argv:
              - systemd-run
              - "--unit={{ proxmox_prefix_pilot_unit }}"
              - "--on-active={{ proxmox_prefix_pilot_rollback_seconds }}s"
              - --timer-property=AccuracySec=1s
              - /bin/bash
              - "{{ proxmox_prefix_pilot_state_dir }}/rollback.sh"
              - "{{ proxmox_prefix_pilot_state_dir }}"
              - /etc/network/interfaces
              - /usr/sbin/ifreload
          changed_when: true

        - name: Require the rollback timer to be active before the reload
          ansible.builtin.command:
            argv: [systemctl, is-active, "{{ proxmox_prefix_pilot_unit }}.timer"]
          changed_when: false

        - name: Activate the staged network through PVE without FRR regeneration
          ansible.builtin.command:
            argv: [pvesh, set, "/nodes/{{ proxmox_prefix_pilot_node }}/network", --regenerate-frr, "0", --output-format, json]
          register: _prefix_apply
          changed_when: true

        - name: Allow the existing SSH transport to reconnect
          ansible.builtin.wait_for_connection:
            timeout: 30
            connect_timeout: 3

        - name: Require the selected host's network-task identifier
          ansible.builtin.assert:
            that:
              - (_prefix_apply.stdout | from_json) is string
              - (_prefix_apply.stdout | from_json) is match('^UPID:' ~ proxmox_prefix_pilot_node ~ ':')
            quiet: true

        - name: Wait for the actual background reload to stop
          ansible.builtin.command:
            argv: [pvesh, get, "/nodes/{{ proxmox_prefix_pilot_node }}/tasks/{{ _prefix_apply.stdout | from_json }}/status", --output-format, json]
          register: _prefix_task_status
          changed_when: false
          until: (_prefix_task_status.stdout | from_json)['status'] == 'stopped'
          retries: 15
          delay: 2

        - name: Require successful reload completion
          ansible.builtin.assert:
            that:
              - (_prefix_task_status.stdout | from_json)['exitstatus'] == 'OK'
            quiet: true

        - name: Read the resulting management address
          ansible.builtin.command:
            argv: [ip, -j, address, show, dev, vmbr0]
          register: _prefix_after_runtime
          changed_when: false

        - name: Read the committed PVE interface
          ansible.builtin.command:
            argv: [pvesh, get, "/nodes/{{ proxmox_prefix_pilot_node }}/network/vmbr0", --output-format, json]
          register: _prefix_after_pve
          changed_when: false

        - name: Require the approved runtime and persisted prefix
          ansible.builtin.assert:
            that:
              - (_prefix_after_runtime.stdout | from_json)[0]['addr_info'] | selectattr('family', 'equalto', 'inet') | list | length == 1
              - (_prefix_after_runtime.stdout | from_json)[0]['addr_info'] | selectattr('local', 'equalto', proxmox_prefix_pilot_address) | selectattr('prefixlen', 'equalto', 24) | list | length == 1
              - (_prefix_after_pve.stdout | from_json)['cidr'] == proxmox_prefix_pilot_after
              - (_prefix_after_pve.stdout | from_json)['gateway'] == '10.0.10.1'
              - (_prefix_after_pve.stdout | from_json)['bridge_ports'] == proxmox_prefix_pilot_target.bridge_ports
            quiet: true

        - name: Verify the gateway after the prefix change
          ansible.builtin.command:
            argv: [ping, -n, -c, "1", -W, "2", 10.0.10.1]
          changed_when: false

        - name: Read post-change cluster membership and quorum
          ansible.builtin.command:
            argv: [pvesh, get, /cluster/status, --output-format, json]
          register: _prefix_after_cluster
          changed_when: false

        - name: Require six online members and maintained quorum
          ansible.builtin.assert:
            that:
              - (_prefix_after_cluster.stdout | from_json) | selectattr('type', 'equalto', 'node') | selectattr('online', 'equalto', 1) | list | length == 6
              - (_prefix_after_cluster.stdout | from_json) | selectattr('type', 'equalto', 'cluster') | selectattr('quorate', 'equalto', 1) | list | length == 1
            quiet: true

        - name: Read storage bond parameters after host reload
          ansible.builtin.slurp:
            src: "/sys/class/net/{{ proxmox_prefix_pilot_target.bond_interface }}/bonding/{{ item }}"
          loop: "{{ (proxmox_prefix_pilot_target.bond_parameters | default({})).keys() | list }}"
          register: _prefix_bond_after
          no_log: true

        - name: Require storage bond runtime parameters to remain unchanged
          ansible.builtin.assert:
            that:
              - (_prefix_bond_after.results | map(attribute='content') | list) == (_prefix_bond_before.results | map(attribute='content') | list)
            quiet: true

        - name: Read the NAS interface after the PVE host reload
          ansible.builtin.command:
            argv: [ip, -j, address, show, dev, eth0]
          delegate_to: nas_unraid
          register: _prefix_nas_after
          changed_when: false
          no_log: true
          when: proxmox_prefix_pilot_node == 'storage'

        - name: Require NAS interface identity and prefix to remain unchanged
          ansible.builtin.assert:
            that:
              - (_prefix_nas_after.stdout | from_json)[0]['ifname'] == (_prefix_nas_before.stdout | from_json)[0]['ifname']
              - (_prefix_nas_after.stdout | from_json)[0]['address'] == (_prefix_nas_before.stdout | from_json)[0]['address']
              - ((_prefix_nas_after.stdout | from_json)[0]['addr_info'] | selectattr('family', 'equalto', 'inet') | map(attribute='local') | list) == ((_prefix_nas_before.stdout | from_json)[0]['addr_info'] | selectattr('family', 'equalto', 'inet') | map(attribute='local') | list)
              - ((_prefix_nas_after.stdout | from_json)[0]['addr_info'] | selectattr('family', 'equalto', 'inet') | map(attribute='prefixlen') | list) == ((_prefix_nas_before.stdout | from_json)[0]['addr_info'] | selectattr('family', 'equalto', 'inet') | map(attribute='prefixlen') | list)
            quiet: true
          when: proxmox_prefix_pilot_node == 'storage'

        - name: Verify the unchanged compute guest from the controller
          ansible.builtin.command:
            argv: [kubectl, wait, --for=condition=Ready, "node/{{ proxmox_prefix_pilot_guest }}", --timeout=30s]
          delegate_to: localhost
          changed_when: false
          when: proxmox_prefix_pilot_guest | length > 0

        - name: Verify protected guest configurations and power state after the host reload
          block:
            - name: Read each protected guest configuration after reload
              ansible.builtin.command:
                argv: [pvesh, get, "/nodes/{{ proxmox_prefix_pilot_node }}/{{ item.kind }}/{{ item.id }}/config", --output-format, json]
              loop: "{{ proxmox_prefix_pilot_target.protected_guests }}"
              register: _prefix_protected_config_after
              changed_when: false
              no_log: true

            - name: Require every protected guest configuration to remain identical
              ansible.builtin.assert:
                that:
                  - (item.stdout | from_json) == (_prefix_protected_config_before.results[guest_index].stdout | from_json)
                quiet: true
              loop: "{{ _prefix_protected_config_after.results }}"
              loop_control:
                index_var: guest_index
              no_log: true

            - name: Read each protected guest running state after reload
              ansible.builtin.command:
                argv: [pvesh, get, "/nodes/{{ proxmox_prefix_pilot_node }}/{{ item.kind }}/{{ item.id }}/status/current", --output-format, json]
              loop: "{{ proxmox_prefix_pilot_target.protected_guests }}"
              register: _prefix_protected_status_after
              changed_when: false
              no_log: true

            - name: Require protected guests running with unchanged QEMU process identities
              ansible.builtin.assert:
                that:
                  - (item.stdout | from_json)['status'] == 'running'
                  - item.item.kind != 'qemu' or ((item.stdout | from_json)['pid'] == (_prefix_protected_status_before.results[guest_index].stdout | from_json)['pid'])
                quiet: true
              loop: "{{ _prefix_protected_status_after.results }}"
              loop_control:
                index_var: guest_index
              no_log: true
          when: proxmox_prefix_pilot_target.protected_guests | length > 0

        - name: Read the Technitium daemon identity after edge reload
          ansible.builtin.command:
            argv: [pct, exec, "200", --, /run/current-system/sw/bin/systemctl, show, technitium-dns-server.service, --property=MainPID, --value]
          register: _prefix_dns_pid_after
          changed_when: false
          when: proxmox_prefix_pilot_node == 'edge'

        - name: Require the Technitium process to remain running without a restart
          ansible.builtin.assert:
            that:
              - _prefix_dns_pid_after.stdout | trim | int > 0
              - (_prefix_dns_pid_after.stdout | trim) == (_prefix_dns_pid_before.stdout | trim)
            quiet: true
          when: proxmox_prefix_pilot_node == 'edge'

        - name: Verify scoped DNS behavior before confirming the host change
          ansible.builtin.command:
            argv: [node, -e, "{{ proxmox_prefix_pilot_dns_probe }}", "{{ item.server }}", "{{ item.domain }}", "{{ item.expected_address }}"]
          loop: "{{ proxmox_prefix_pilot_target.dns_checks }}"
          delegate_to: localhost
          changed_when: false

        - name: Verify the selected control-plane API after the host reload
          ansible.builtin.command:
            argv: [kubectl, "--server=https://{{ proxmox_prefix_pilot_api_address }}:6443", --request-timeout=10s, get, --raw=/readyz]
          delegate_to: localhost
          register: _prefix_api_after
          changed_when: false
          failed_when: _prefix_api_after.rc != 0 or (_prefix_api_after.stdout | trim) != 'ok'
          when: proxmox_prefix_pilot_api_address | length > 0

        - name: Verify attached service ports before confirming the host change
          ansible.builtin.wait_for:
            host: "{{ item.host }}"
            port: "{{ item.port }}"
            connect_timeout: 2
            timeout: 5
            state: started
          delegate_to: localhost
          loop: "{{ proxmox_prefix_pilot_target.service_checks }}"

        - name: Confirm only while holding the rollback lock
          ansible.builtin.command:
            argv:
              - /bin/bash
              - -c
              - "{{ proxmox_prefix_pilot_confirm_script }}"
              - prefix-confirm
              - "{{ proxmox_prefix_pilot_state_dir }}"
              - /etc/network/interfaces
              - "{{ proxmox_prefix_pilot_unit }}"
              - /usr/bin/systemctl
          changed_when: true

        - name: Record the completed one-host pilot
          ansible.builtin.debug:
            msg: "{{ proxmox_prefix_pilot_node }} is {{ proxmox_prefix_pilot_after }}, reload and host/guest/service checks passed, rollback cancelled under lock."
      rescue:
        - name: Stop and preserve local recovery rather than retrying a network change
          ansible.builtin.fail:
            msg: >-
              Pilot completion was not confirmed. If armed, leave the local rollback
              timer {{ proxmox_prefix_pilot_unit }} running and inspect actual state.
              Pre-activation staging may remain. No blind reload, retry, guest restart
              or overwrite of another operator's file is performed.