---
- name: Install native openNDS only on the isolated portal VM
  hosts: guest_portal_stage
  gather_facts: false
  become: true
  tasks:
    - name: Refuse every production endpoint
      ansible.builtin.assert:
        that:
          - vm_id | int == 104
          - ansible_host == '127.0.0.1'
          - ansible_port | int == 22104

    - name: Verify the running staging identity
      ansible.builtin.command:
        argv: [hostname]
      register: portal_hostname
      changed_when: false
      failed_when: portal_hostname.stdout != 'guest-portal-stage'

    - name: Detect the production transit attachment before any staging stop
      ansible.builtin.stat:
        path: /sys/class/net/portal-transit
      register: portal_production_attachment

    - name: Refuse staging operations on the serving gateway without maintenance approval
      ansible.builtin.assert:
        that:
          - not portal_production_attachment.stat.exists or portal_staging_maintenance_allowed | default(false) | bool
        fail_msg: The live guest gateway requires explicit staging maintenance approval.

    - name: Install the reviewed Debian openNDS package without starting services
      ansible.builtin.apt:
        name:
          - opennds=10.3.1+dfsg-1
          - nftables
          - dnsmasq
          - inotify-tools
          - udhcpc
          - bind9-dnsutils
          - conntrack
        state: present
        update_cache: true
        cache_valid_time: 3600
        policy_rc_d: 101

    - name: Keep gateway services stopped until the isolated network is configured
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop: [opennds, dnsmasq]

    - name: Verify the native installed version
      ansible.builtin.command:
        argv: [dpkg-query, -W, '-f=${Version}', opennds]
      register: portal_opennds_version
      changed_when: false
      failed_when: portal_opennds_version.stdout != '10.3.1+dfsg-1'

    - name: Install the daemonless runtime only for the external DHCP fixture
      ansible.builtin.apt:
        name: podman
        state: present
        policy_rc_d: 101
      when: portal_technitium_fixture_allowed | default(false) | bool

    - name: Fetch the pinned official external DHCP fixture image
      ansible.builtin.command:
        argv:
          - podman
          - pull
          - docker.io/technitium/dns-server@sha256:1d5330f216d7e3bbe2192a73d114de61ca7c45800238e570cb22a6e86b7a892f
      when: portal_technitium_fixture_allowed | default(false) | bool
      changed_when: false

    - name: Create the native adapter directory
      ansible.builtin.file:
        path: /usr/local/libexec
        state: directory
        mode: "0755"

    - name: Install the read-only lease adapter
      ansible.builtin.copy:
        src: ../files/opennds-technitium-leases.py
        dest: /usr/local/libexec/opennds-technitium-leases.py
        mode: "0644"

    - name: Verify native lease-cache publication without a client network
      when: portal_adapter_contract_allowed | default(false) | bool
      ansible.builtin.shell: |
        set -eu
        if nft list table inet owl_portal_guard >/dev/null 2>&1; then exit 1; fi
        private=$(mktemp -d /var/tmp/owl-lease-contract-XXXXXX)
        trap 'nft delete table inet owl_portal_guard; rm -rf "$private"' EXIT
        nft add table inet owl_portal_guard
        nft 'add set inet owl_portal_guard technitium_leases { type ipv4_addr; flags timeout; }'
        python3 - "$private" <<'PY'
        import datetime,importlib.util,json,pathlib,subprocess,sys
        spec=importlib.util.spec_from_file_location('adapter','/usr/local/libexec/opennds-technitium-leases.py')
        adapter=importlib.util.module_from_spec(spec)
        spec.loader.exec_module(adapter)
        now=int(datetime.datetime.now(datetime.timezone.utc).timestamp())
        expiry=datetime.datetime.fromtimestamp(now+300,datetime.timezone.utc).isoformat()
        payload={'status':'ok','response':{'leases':[{'scope':'portal-contract','type':'Dynamic','address':'198.18.30.2','hardwareAddress':'02-00-00-00-00-01','leaseExpires':expiry}]}}
        selected=adapter.select_leases(payload,'portal-contract','198.18.30.0/24',now)
        output=pathlib.Path(sys.argv[1])/'leases'
        adapter.publish(selected,output,5,now)
        assert output.stat().st_mode & 0o077 == 0
        native=json.loads(subprocess.check_output(['nft','-j','list','set','inet','owl_portal_guard','technitium_leases']))
        elements=next(entry['set']['elem'] for entry in native['nftables'] if 'set' in entry)
        assert len(elements)==1 and 0<elements[0]['elem']['expires']<=5 and elements[0]['elem']['timeout']==5
        failed=subprocess.run(['python3','/usr/local/libexec/opennds-technitium-leases.py','--stdin','--output',str(output)],input=json.dumps({'status':'invalid-token'}),text=True,capture_output=True)
        assert failed.returncode==1 and output.read_text()==''
        native=json.loads(subprocess.check_output(['nft','-j','list','set','inet','owl_portal_guard','technitium_leases']))
        assert not next(entry['set'] for entry in native['nftables'] if 'set' in entry).get('elem')
        print('NATIVE_LEASE_CACHE_TIMEOUT_AND_FAILURE_CLEAR_PASS')
        PY
      args:
        executable: /bin/bash
      register: portal_adapter_contract
      changed_when: true

    - name: Report the native adapter contract result
      ansible.builtin.debug:
        msg: "{{ portal_adapter_contract.stdout_lines }}"
      when: portal_adapter_contract_allowed | default(false) | bool

    - name: Prepare the native external-lease configuration directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0700"
      loop: [/etc/config, /var/lib/opennds]
      when: portal_technitium_fixture_allowed | default(false) | bool

    - name: Select the genuine exported lease file for the external DHCP fixture
      ansible.builtin.copy:
        dest: /etc/config/opennds
        mode: "0600"
        backup: true
        content: |
          config opennds
            option enabled '1'
            option gatewayname '{{ "owl.red guest" if portal_https_fas_allowed | default(false) | bool else "owl.red external DHCP qualification" }}'
            option gatewayinterface 'br-portal-test'
            option gatewayport '2050'
            option maxclients '8'
            option login_option_enabled '{{ 0 if portal_https_fas_allowed | default(false) | bool else 1 }}'
            option dhcp_leases_file '/var/lib/opennds/technitium.leases'
            option checkinterval '5'
            option allow_preemptive_authentication '0'
          {% if portal_https_fas_allowed | default(false) | bool %}
            option fasport '443'
            option fasremoteip '10.0.10.201'
            option fasremotefqdn 'guest.owl.red'
            option faspath '/'
            option fas_secure_enabled '4'
            option faskey '{{ lookup("file", lookup("env", "HOME") + "/.local/state/owl-red/guest-portal/fas.key") }}'
          {% endif %}
      when: portal_technitium_fixture_allowed | default(false) | bool
      no_log: true

    - name: Disable local DHCP for the genuine external DHCP fixture
      ansible.builtin.copy:
        dest: /etc/dnsmasq.d/owl-portal-lab.conf
        mode: "0600"
        content: |
          interface=br-portal-test
          listen-address=198.18.30.1
          bind-dynamic
          no-resolv
          server=10.0.2.3
          no-dhcp-interface=br-portal-test
      when: portal_technitium_fixture_allowed | default(false) | bool

    - name: Verify genuine external DHCP allocation and native lease export
      when: portal_technitium_fixture_allowed | default(false) | bool
      ansible.builtin.shell: |
        set -eu
        if ip link show br-portal-test >/dev/null 2>&1; then exit 1; fi
        if ip netns list | grep -qE '^owl-portal-(client|dhcp) '; then exit 1; fi
        if nft list table inet owl_portal_guard >/dev/null 2>&1; then exit 1; fi
        if podman container exists owl-portal-dhcp; then exit 1; fi
        if pgrep -x opennds >/dev/null; then exit 1; fi
        private=$(mktemp -d /var/tmp/owl-technitium-contract-XXXXXX)
        original_forward=$(cat /proc/sys/net/ipv4/ip_forward)
        original_forward6=$(cat /proc/sys/net/ipv6/conf/all/forwarding)
        original_policy=$(iptables -S FORWARD | awk '$1=="-P" {print $3; exit}')
        original_default=$(ip -4 route show default)
        route_changed=0
        cleanup() {
          systemctl stop owl-portal-contract >/dev/null 2>&1 || true
          systemctl stop dnsmasq >/dev/null 2>&1 || true
          if [[ "$route_changed" = 1 ]]; then
            ip -4 route del default >/dev/null 2>&1 || true
            ip -4 route add $original_default
          fi
          ip rule del priority 10400 >/dev/null 2>&1 || true
          ip route flush table 104 >/dev/null 2>&1 || true
          iptables -t nat -D POSTROUTING -s 198.19.1.2/32 -o bootstrap0 -j MASQUERADE >/dev/null 2>&1 || true
          podman rm -f owl-portal-dhcp >/dev/null 2>&1 || true
          ip netns del owl-portal-client >/dev/null 2>&1 || true
          ip netns del owl-portal-dhcp >/dev/null 2>&1 || true
          ip netns del owl-portal-upstream >/dev/null 2>&1 || true
          ip link del br-portal-test >/dev/null 2>&1 || true
          nft delete table inet owl_portal_guard >/dev/null 2>&1 || true
          iptables -P FORWARD "$original_policy"
          sysctl -qw "net.ipv4.ip_forward=$original_forward"
          sysctl -qw "net.ipv6.conf.all.forwarding=$original_forward6"
        }
        trap cleanup EXIT
        ip link add br-portal-test type bridge
        ip address add 198.18.30.1/24 dev br-portal-test
        ip link set br-portal-test up
        for namespace in client dhcp; do
          ip netns add "owl-portal-$namespace"
          ip link add "owl-$namespace-peer" type veth peer name "owl-$namespace-nic"
          ip link set "owl-$namespace-peer" master br-portal-test
          ip link set "owl-$namespace-peer" up
          ip link set "owl-$namespace-nic" netns "owl-portal-$namespace"
          ip netns exec "owl-portal-$namespace" ip link set lo up
          ip netns exec "owl-portal-$namespace" ip link set "owl-$namespace-nic" up
        done
        ip netns exec owl-portal-dhcp ip address add 198.18.30.3/24 dev owl-dhcp-nic
        ip netns exec owl-portal-client ip link set owl-client-nic address 02:6f:77:30:02:04
        python3 - "$private" <<'PY'
        import pathlib,secrets,sys
        password=pathlib.Path(sys.argv[1])/'password'
        password.write_text(secrets.token_urlsafe(32))
        password.chmod(0o600)
        (password.parent/'config').mkdir(mode=0o700)
        PY
        podman run -d --name owl-portal-dhcp --network ns:/run/netns/owl-portal-dhcp --memory 256m --pids-limit 128 --cap-add NET_ADMIN --cap-add NET_RAW -e DNS_SERVER_ADMIN_PASSWORD_FILE=/run/password -v "$private/password:/run/password:ro" -v "$private/config:/etc/dns" docker.io/technitium/dns-server@sha256:1d5330f216d7e3bbe2192a73d114de61ca7c45800238e570cb22a6e86b7a892f >"$private/container-id"
        timeout 60 podman logs -f owl-portal-dhcp 2>&1 | awk '/Web Service.*started|Web Service.*listening/ {exit}' >"$private/readiness.log" || true
        ip netns exec owl-portal-dhcp python3 - "$private" <<'PY'
        import json,pathlib,sys,urllib.parse,urllib.request
        private=pathlib.Path(sys.argv[1])
        def api(path,parameters):
          request=urllib.request.Request('http://127.0.0.1:5380/api/'+path,data=urllib.parse.urlencode(parameters).encode())
          with urllib.request.urlopen(request,timeout=10) as response: payload=json.load(response)
          if payload.get('status')!='ok':
            (private/'api-failure.json').write_text(json.dumps(payload))
            (private/'api-failure.json').chmod(0o600)
            raise RuntimeError('Isolated fixture API failed; private diagnostics retained')
          return payload
        token=api('user/login',{'user':'admin','pass':(private/'password').read_text()})['token']
        (private/'token').write_text(token)
        (private/'token').chmod(0o600)
        api('dhcp/scopes/set',{'token':token,'name':'portal-contract','startingAddress':'198.18.30.2','endingAddress':'198.18.30.8','subnetMask':'255.255.255.0','routerAddress':'198.18.30.1','useThisDnsServer':'false','dnsServers':'198.18.30.1','leaseTimeDays':'0','leaseTimeMinutes':'5','blockLocallyAdministeredMacAddresses':'false','ignoreClientIdentifierOption':'true','exclusions':'198.18.30.3|198.18.30.3'})
        api('dhcp/scopes/enable',{'token':token,'name':'portal-contract'})
        PY
        ip netns exec owl-portal-client udhcpc -i owl-client-nic -n -q -t 3 -T 2 -s /bin/true >"$private/dhcp.log" 2>&1
        nft add table inet owl_portal_guard
        nft 'add set inet owl_portal_guard technitium_leases { type ipv4_addr; flags timeout; }'
        ip netns exec owl-portal-dhcp python3 /usr/local/libexec/opennds-technitium-leases.py --api-url http://127.0.0.1:5380/api/dhcp/leases/list --token-file "$private/token" --scope portal-contract --subnet 198.18.30.0/24 --check-only
        ip netns exec owl-portal-dhcp python3 - "$private" <<'PY' | python3 /usr/local/libexec/opennds-technitium-leases.py --stdin --scope portal-contract --subnet 198.18.30.0/24 --output "$private/leases"
        import json,pathlib,sys,urllib.parse,urllib.request
        request=urllib.request.Request('http://127.0.0.1:5380/api/dhcp/leases/list',data=urllib.parse.urlencode({'token':(pathlib.Path(sys.argv[1])/'token').read_text()}).encode())
        with urllib.request.urlopen(request,timeout=5) as response: payload=json.load(response)
        snapshot=pathlib.Path(sys.argv[1])/'snapshot.json'
        snapshot.write_text(json.dumps(payload))
        snapshot.chmod(0o600)
        print(json.dumps(payload))
        PY
        awk '$2=="02:6f:77:30:02:04" && $3=="198.18.30.2" {found=1} END {exit !found}' "$private/leases"
        printf 'GENUINE_TECHNITIUM_DHCP_AND_LEASE_EXPORT_PASS\n'
        install -m 0600 "$private/leases" /var/lib/opennds/technitium.leases
        ip netns exec owl-portal-client ip address add 198.18.30.2/24 dev owl-client-nic
        ip netns exec owl-portal-client ip route add default via 198.18.30.1
        ip netns add owl-portal-upstream
        ip link add owl-transit type veth peer name owl-up-transit
        ip link set owl-up-transit netns owl-portal-upstream
        ip address add 198.19.0.1/30 dev owl-transit
        ip link set owl-transit up
        ip link add owl-uplink type veth peer name owl-up-uplink
        ip link set owl-up-uplink netns owl-portal-upstream
        ip address add 198.19.1.1/30 dev owl-uplink
        ip link set owl-uplink up
        ip netns exec owl-portal-upstream ip link set lo up
        ip netns exec owl-portal-upstream ip address add 198.19.0.2/30 dev owl-up-transit
        ip netns exec owl-portal-upstream ip address add 198.19.1.2/30 dev owl-up-uplink
        ip netns exec owl-portal-upstream ip link set owl-up-transit up
        ip netns exec owl-portal-upstream ip link set owl-up-uplink up
        ip netns exec owl-portal-upstream ip route add 198.18.30.0/24 via 198.19.0.1
        ip netns exec owl-portal-upstream ip route add default via 198.19.1.1
        ip netns exec owl-portal-upstream sysctl -qw net.ipv4.ip_forward=1
        ip netns exec owl-portal-upstream iptables -t nat -A POSTROUTING -s 198.18.0.0/15 -o owl-up-uplink -j MASQUERADE
        ip route add table 104 default via 10.0.2.2 dev bootstrap0
        ip rule add priority 10400 iif owl-uplink lookup 104
        route_changed=1
        ip -4 route del default
        ip route add default via 198.19.0.2 dev owl-transit
        ping -c 1 -W 2 198.19.0.2 >"$private/upstream-reachable.log"
        nft 'add chain inet owl_portal_guard forward { type filter hook forward priority 200; policy drop; }'
        {% if portal_https_fas_allowed | default(false) | bool %}
        nft 'add rule inet owl_portal_guard forward iifname "br-portal-test" oifname "owl-transit" ip saddr 198.18.30.0/24 ip daddr 10.0.10.201 tcp dport 443 counter accept'
        nft 'add rule inet owl_portal_guard forward iifname "owl-transit" oifname "br-portal-test" ip saddr 10.0.10.201 ip daddr 198.18.30.0/24 tcp sport 443 ct state established counter accept'
        {% endif %}
        nft 'add rule inet owl_portal_guard forward iifname "br-portal-test" oifname "owl-transit" ip saddr 198.18.30.0/24 meta mark & 0x30000 == 0x30000 counter accept'
        nft 'add rule inet owl_portal_guard forward iifname "owl-transit" oifname "br-portal-test" ip daddr 198.18.30.0/24 meta mark & 0x30000 == 0x30000 counter accept'
        nft 'add rule inet owl_portal_guard forward iifname "owl-uplink" oifname "bootstrap0" ip saddr 198.19.1.2 counter accept'
        nft 'add rule inet owl_portal_guard forward iifname "bootstrap0" oifname "owl-uplink" ip daddr 198.19.1.2 counter accept'
        sysctl -qw net.ipv4.ip_forward=1
        iptables -P FORWARD ACCEPT
        iptables -t nat -A POSTROUTING -s 198.19.1.2/32 -o bootstrap0 -j MASQUERADE
        server=$(getent ahostsv4 example.com | awk 'NR==1 {print $1; exit}')
        systemctl start dnsmasq
        rm -f /tmp/ndsctl.sock /tmp/ndscids/heartbeat
        truncate -s 0 /tmp/ndslog/authlog.log
        find /tmp/ndscids/preemptive_auth -maxdepth 1 -type f -delete
        systemd-run --unit owl-portal-contract --collect --property Type=forking "$(command -v opennds)" -b >"$private/native-start.log" 2>&1
        if ! test -S /tmp/ndsctl.sock; then
          inotifywait -qq -t 60 -e create --include 'ndsctl\.sock$' /tmp || test -S /tmp/ndsctl.sock
        fi
        if ip netns exec owl-portal-client curl --noproxy '*' -fsS --connect-timeout 2 --max-time 3 --resolve "example.com:443:$server" https://example.com/ -o /dev/null 2>"$private/preauth.log"; then exit 1; fi
        code=$(ip netns exec owl-portal-client curl --noproxy '*' -sS --max-time 8 --resolve "example.com:80:$server" -D "$private/discovery.headers" -o /dev/null -w '%{http_code}' http://example.com/)
        test "$code" = 302 || test "$code" = 307
        {% if portal_https_fas_allowed | default(false) | bool %}
        ip netns exec owl-portal-client python3 - "$private" <<'PY'
        import http.cookiejar,html.parser,json,pathlib,selectors,subprocess,sys,time,urllib.parse,urllib.request
        private=pathlib.Path(sys.argv[1])
        headers=(private/'discovery.headers').read_text().splitlines()
        location=next(line.split(':',1)[1].strip() for line in headers if line.lower().startswith('location:'))
        target=urllib.parse.urlsplit(location)
        assert target.scheme=='https' and target.hostname=='guest.owl.red' and target.port in (None,443) and target.path=='/'
        entered=int(subprocess.check_output(['systemctl','show','owl-portal-contract','-p','ActiveEnterTimestampMonotonic','--value'],text=True))
        readiness=subprocess.Popen(['journalctl','-u','owl-portal-contract','--follow','--output=json','--since=-2min','--no-pager'],stdout=subprocess.PIPE,stderr=subprocess.PIPE)
        ready_selector=selectors.DefaultSelector()
        try:
          ready_selector.register(readiness.stdout,selectors.EVENT_READ)
          ready_deadline=time.monotonic()+30
          ready=False; buffered=b''
          while time.monotonic()<ready_deadline and not ready:
            if not ready_selector.select(max(0,ready_deadline-time.monotonic())): break
            import os
            buffered+=os.read(readiness.stdout.fileno(),65536)
            while b'\n' in buffered:
              line,buffered=buffered.split(b'\n',1)
              event=json.loads(line)
              if int(event.get('__MONOTONIC_TIMESTAMP','0'))>=entered and 'nat_traversal_poll_interval' in event.get('MESSAGE',''):
                ready=True; break
          assert ready,'Native Authmon did not finish startup clearing before consent'
        finally:
          ready_selector.close(); readiness.terminate(); readiness.communicate(timeout=5)
        opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
        class OfferParser(html.parser.HTMLParser):
          offer=None
          def handle_starttag(self,tag,attributes):
            fields=dict(attributes)
            if tag=='input' and fields.get('name')=='offer': self.offer=fields.get('value')
        try:
          with opener.open(location,timeout=15) as response: page=response.read().decode()
        except urllib.error.HTTPError as failure:
          (private/'fas-page-failure.html').write_bytes(failure.read())
          raise RuntimeError('Native FAS handoff rejected; private diagnostics retained') from None
        parser=OfferParser(); parser.feed(page)
        assert parser.offer,'Native portal offer is missing'
        log=pathlib.Path('/tmp/ndslog/binauthlog.log')
        observer=subprocess.Popen(['inotifywait','-m','-e','modify,create,moved_to','--format','%f',str(log.parent)],stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True)
        selector=selectors.DefaultSelector()
        try:
          assert observer.stderr.readline().startswith('Setting up watches')
          assert observer.stderr.readline().startswith('Watches established')
          selector.register(observer.stdout,selectors.EVENT_READ)
          started=int(time.time())
          request=urllib.request.Request('https://guest.owl.red/',data=urllib.parse.urlencode({'offer':parser.offer,'consent':'yes'}).encode(),headers={'Origin':'https://guest.owl.red'})
          with opener.open(request,timeout=15) as response:
            consent_page=response.read().decode()
            assert response.status==200 and ('Joining the Flock' in consent_page or 'Access Granted' in consent_page),'Consent did not create a pending portal request'
          deadline=time.monotonic()+20
          authenticated=False
          while time.monotonic()<deadline:
            try: lines=log.read_text().splitlines()
            except FileNotFoundError: lines=[]
            for line in lines:
              fields=dict(part.split('=',1) for part in line.split(', ') if '=' in part)
              if fields.get('clientmac')=='02:6f:77:30:02:04' and fields.get('method')=='ndsctl_auth' and int(fields.get('session_start','0'))>=started:
                authenticated=True; break
            if authenticated: break
            if not selector.select(max(0,deadline-time.monotonic())): break
            import os
            os.read(observer.stdout.fileno(),65536)
          if not authenticated:
            import shlex
            arguments=dict(line.split('=',1) for line in pathlib.Path('/tmp/ndscids/authmonargs').read_text().splitlines() if '=' in line)
            values={name:shlex.split(value)[0] for name,value in arguments.items()}
            control=values['url']+'?'+urllib.parse.urlencode({'auth_get':'view','gatewayhash':values['gatewayhash'],'payload':'bm9uZQ=='})
            probe=subprocess.run(['nsenter','-t','1','-n','curl','--noproxy','*','--connect-timeout','3','--max-time','6','-sS','-o','/dev/null','-w','%{http_code}',control],capture_output=True,text=True,timeout=8)
            native=subprocess.run(['nsenter','-t','1','-n','/usr/lib/opennds/libopennds.sh','wget_request',values['url'],'view',values['gatewayhash'],values['user_agent'],'none'],capture_output=True,text=True,timeout=20)
            methods=sorted({dict(part.split('=',1) for part in line.split(', ') if '=' in part).get('method','') for line in log.read_text().splitlines()[-20:]}) if log.exists() else []
            client=subprocess.run(['nsenter','-t','1','-n','ndsctl','json','198.18.30.2'],capture_output=True,text=True,timeout=10)
            try: state=json.loads(client.stdout)
            except ValueError: state={}
            def states(value):
              if isinstance(value,dict): return [str(item) for name,item in value.items() if name=='state']+sum([states(item) for item in value.values()],[])
