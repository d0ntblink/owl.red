              inotifywait -qq -t 10 -e create --include 'owl-portal-stopped$' /run || test -e /run/owl-portal-stopped
            fi
            nft -j list chain inet owl_portal_guard forward | python3 -c 'import json,sys; data=json.load(sys.stdin)["nftables"]; assert not any("rule" in entry for entry in data); assert any(entry.get("chain",{}).get("policy")=="drop" for entry in data)'
            if ip netns exec owl-portal-client curl --noproxy '*' -fsS --connect-timeout 2 --max-time 3 --resolve "example.com:443:$server" https://example.com/ -o /dev/null 2>"$diagnostics/after-crash.log"; then exit 1; fi
            printf 'NATIVE_PORTAL_CRASH_CLEANUP_DENY_PASS\n'
            if ! test -S /tmp/ndsctl.sock; then
              inotifywait -qq -t 60 -e create --include 'ndsctl\.sock$' /tmp || test -S /tmp/ndsctl.sock
            fi
            test "$(systemctl show opennds -p NRestarts --value)" -ge 1
            test "$(systemctl show opennds -p MainPID --value)" != "$previous_pid"
            nft list chain ip nds_filter ndsNET | grep -q 'counter.*reject'
            if ip netns exec owl-portal-client curl --noproxy '*' -fsS --connect-timeout 2 --max-time 3 --resolve "example.com:443:$server" https://example.com/ -o /dev/null 2>"$diagnostics/restart-preauth.log"; then exit 1; fi
            ip netns exec owl-portal-client curl --noproxy '*' -sS --max-time 8 --resolve "example.com:80:$server" -o /dev/null http://example.com/
            ndsctl auth 198.18.30.2 >"$diagnostics/recovered-grant.log" 2>&1
            ip netns exec owl-portal-client curl --noproxy '*' -fsS --connect-timeout 3 --max-time 6 --resolve "example.com:443:$server" https://example.com/ -o /dev/null
            printf 'NATIVE_PORTAL_AUTOMATIC_RESTART_PASS\n'
          args:
            executable: /bin/bash
          register: portal_qualification
          changed_when: true

        - name: Report the bounded native qualification result
          ansible.builtin.debug:
            msg: "{{ portal_qualification.stdout_lines }}"