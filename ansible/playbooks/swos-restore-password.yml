---
- name: Restore the existing Bitwarden password after an approved switch reset
  hosts: switch_swos
  gather_facts: false
  vars:
    swos_password_restore_allowed: false
    swos_current_password: "{{ lookup('env', 'SWOS_CURRENT_PASSWORD') | default('', true) }}"
    swos_desired_password: "{{ lookup('env', 'SWOS_PASSWORD') }}"
  tasks:
    - name: Require explicit reset recovery and the known switch endpoint
      ansible.builtin.assert:
        that:
          - swos_password_restore_allowed | bool
          - ansible_connection == 'local'
          - ansible_host == '10.0.10.2'
          - swos_username == 'admin'
        fail_msg: This password-only recovery requires explicit approval and the existing CSS326 endpoint.

    - name: Apply and verify the vault password without exposing credential values
      swos_password:
        host: "{{ ansible_host }}"
        username: "{{ swos_username }}"
        current_password: "{{ swos_current_password }}"
        new_password: "{{ swos_desired_password }}"
        expected_serial: CAC90C5B5282
      register: swos_password_result
      no_log: true

    - name: Report verified switch credential status
      ansible.builtin.debug:
        msg:
          changed: "{{ swos_password_result.changed }}"
          verified: "{{ swos_password_result.verified }}"
          serial: "{{ swos_password_result.serial }}"