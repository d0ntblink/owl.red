---
all:
  vars:
    domain_name: owl.red
    ansible_python_interpreter: auto_silent
  children:
    technitium_lxc:
      vars:
        # Proxy through edge.pve — 10.0.10.30 is not directly reachable from WSL
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o ProxyJump=root@10.0.10.3"
        # NixOS: Python lives in the nix profile, not /usr/bin
        ansible_python_interpreter: /run/current-system/sw/bin/python3
      hosts:
        technitium:
          ansible_host: 10.0.10.30
          ansible_user: root
          fqdn: technitium.owl.red
          platform: lxc
          addressing:
            vlan_id: 10
            ip: 10.0.10.30
            prefix: 24
            gateway: 10.0.10.1

    vyos_labs:
      hosts:
        edge_lab:
          ansible_host: 127.0.0.1
          ansible_port: 22102
          ansible_user: owl-ansible
          ansible_python_interpreter: /usr/bin/python3
          ansible_ssh_common_args: >-
            -o HostKeyAlias=edge-lab.owl.red
            -o UserKnownHostsFile={{ lookup('env', 'HOME') }}/.local/state/owl-red/vyos-known_hosts
            -o ProxyCommand="ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i {{ lookup('env', 'HOME') }}/.ssh/id_ed25519_owl_ansible -W %h:%p root@10.0.10.3"
          fqdn: edge-lab.owl.red
          platform: vyos
          vm_id: 102

    network_edge:
      hosts:
        edge_router:
          ansible_host: 10.0.10.1
          ansible_user: owl-ansible
          ansible_python_interpreter: /usr/bin/python3
          ansible_ssh_common_args: >-
            -o HostKeyAlias=edge.owl.red
            -o UserKnownHostsFile={{ lookup('env', 'HOME') }}/.local/state/owl-red/vyos-known_hosts
          fqdn: edge.owl.red
          platform: vyos
          vm_id: 103
          addressing:
            current_flat:
              ip: 10.0.10.1
              prefix: 24
              gateway: 10.0.10.1
            target_vlan:
              vlan_id: 10
              ip: 10.0.10.1
              prefix: 24
              gateway: 10.0.10.1

    switches:
